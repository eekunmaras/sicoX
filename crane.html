<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>クレーンゲーム</title>
  <style>
    :root { --primary: #ff0055; --secondary: #00e5ff; --yellow: #ffdd00; --panel-bg: #fffbe6; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(45deg, #ff4081, #ff4081 20px, #ff79b0 20px, #ff79b0 40px);
      overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: var(--game-h, 100%); z-index: 1; }
    .ui-layer {
      position: absolute; z-index: 10; background: var(--panel-bg);
      border: 4px solid #333; border-radius: 12px; padding: 10px;
      box-shadow: 4px 4px 0px #000; color: #333; font-weight: bold;
    }
    #header { top: 15px; left: 15px; display: flex; flex-direction: column; gap: 5px; }
    .point-display { font-size: 1.2rem; color: var(--primary); text-shadow: 1px 1px 0px #000; }
    .btn-dex {
      background: var(--secondary); border: 2px solid #000; padding: 5px 10px;
      border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0px #000;
      width: fit-content; margin-top: 5px;
    }
    .btn-dex:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
    #btn-machine-toggle {
      position: absolute; top: 15px; right: 15px; z-index: 20;
      background: var(--yellow); border: 3px solid #333; padding: 10px 15px;
      border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #000;

    #btn-machine-toggle:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
    #btn-camera-toggle {
      position: absolute; top: 65px; right: 15px; z-index: 20;
      background: #88ccff; border: 3px solid #333; padding: 8px 12px;
      border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #000;

    .control-btn {

      font-size: max(1.2rem, 3.5vmin); font-weight: bold; cursor: pointer;

    .control-btn span { font-size: 0.5em; margin-top: 2px; }
    .control-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #222, inset 0 5px 10px rgba(255,255,255,0.5); }
    .control-btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(50%); }
    #btn-coin  { background: linear-gradient(#ffdd00, #ffaa00); color: #333; }
    #btn-right { background: linear-gradient(#ff5555, #cc0000); color: white; }
    #btn-up    { background: linear-gradient(#55ff55, #00cc00); color: white; }
    #btn-drop  { background: linear-gradient(#5555ff, #0000cc); color: white; }
    .modal-overlay {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center;

    /* 図鑑 */
    .dex-container {
      background: #fff; width: 90%; max-width: 600px; border-radius: 12px;

    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 10px; margin-top: 20px; }
    .dex-item {
      background: #eee; border: 2px solid #ccc; border-radius: 8px; padding: 5px;
      font-size: 0.65rem; font-weight: bold;

    }
    .dex-item.acquired {
      background: var(--yellow); color: #000; border-color: #ff9900;

    }
    .dex-item.acquired:hover { transform: scale(1.07); box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
    .dex-item img { width: 54px; height: 54px; border-radius: 5px; display: block; margin: 0 auto 3px; }
    /* キャラ詳細モーダル */
    #char-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88); z-index: 200;

    #char-modal.show { display: flex; }
    #char-modal-inner {
      background: var(--panel-bg); border: 4px solid var(--secondary); border-radius: 18px;
      padding: 22px 24px; text-align: center; width: 80%; max-width: 340px;
      box-shadow: 6px 6px 0 #000;
    }
    #char-preview-canvas { width: 220px; height: 220px; border-radius: 14px; border: 3px solid #aaa; display: block; margin: 0 auto; }
    #char-modal-name { font-size: 1.5rem; font-weight: bold; margin: 14px 0 4px; color: var(--primary); text-shadow: 1px 1px 0 #000; }
    #char-modal-num { font-size: 0.9rem; color: #666; margin-bottom: 4px; }
    .close-btn { margin-top: 18px; padding: 10px 30px; background: #333; color: white; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; }
    .win-text { font-size: 4rem; font-weight: 900; color: #ffeb3b; text-shadow: 0 0 20px #ff0000, 3px 3px 0 #000; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .win-reward { font-size: 1.5rem; color: #fff; margin-top: 20px; text-shadow: 2px 2px 0 #000; }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

<script>
// ==========================================
// 1. システム（sicoX連携 / SicoFXと同様）
// ==========================================
const CRANE_EMBEDDED = window.parent && window.parent !== window;
const CRANE_REQS = new Map();
function craneReq(type, payload = {}, timeout = 5000) {
  if (!CRANE_EMBEDDED) return Promise.resolve({ ok: false, error: 'sicoX内から起動してください' });
  const reqId = 'cr' + Date.now() + Math.random().toString(36).slice(2, 8);
  return new Promise(resolve => {
    const timer = setTimeout(() => { CRANE_REQS.delete(reqId); resolve({ ok: false, error: 'sicoXとの通信がタイムアウトしました' }); }, timeout);
    CRANE_REQS.set(reqId, { resolve, timer });
    parent.postMessage(Object.assign({ type, reqId }, payload), '*');
  });
}
window.addEventListener('message', e => {
  const msg = e.data || {};
  if (msg.type === 'crane:response' && CRANE_REQS.has(msg.reqId)) {
    const req = CRANE_REQS.get(msg.reqId);
    clearTimeout(req.timer);
    CRANE_REQS.delete(msg.reqId);
    req.resolve(msg);
  }
});

const user = { points: 0 };

function updatePointsDisplay() {
  document.getElementById('user-points').innerText = user.points.toLocaleString();
}

// ─── 図鑑データ永続化（4重保存: localStorage / IndexedDB / Cookie / 親フレーム） ───
const DEX_STORAGE_KEY = 'crane_dex_savedata_v2';
const DEX_COOKIE_KEY  = 'crane_dex_cookie_v2';
const DEX_PARENT_TYPE = 'crane:dex:storage';

// ── 親フレーム経由の保存/読み込み（iframeのサードパーティ制限を回避） ──────────────
const DEX_PARENT_REQS = new Map();
function dexParentReq(action, payload = {}, timeout = 4000) {
  if (!CRANE_EMBEDDED) return Promise.resolve({ ok: false });
  const reqId = 'dex' + Date.now() + Math.random().toString(36).slice(2, 6);
  return new Promise(resolve => {
    const timer = setTimeout(() => {
      DEX_PARENT_REQS.delete(reqId);
      resolve({ ok: false });
    }, timeout);
    DEX_PARENT_REQS.set(reqId, { resolve, timer });
    parent.postMessage({ type: DEX_PARENT_TYPE, action, reqId, ...payload }, '*');
  });
}
window.addEventListener('message', e => {
  const msg = e.data || {};
  if (msg.type === DEX_PARENT_TYPE + ':response' && DEX_PARENT_REQS.has(msg.reqId)) {
    const req = DEX_PARENT_REQS.get(msg.reqId);
    clearTimeout(req.timer);
    DEX_PARENT_REQS.delete(msg.reqId);
    req.resolve(msg);
  }
});

async function loadDexParent() {
  try {
    const res = await dexParentReq('get', { key: DEX_STORAGE_KEY });
    if (res.ok && Array.isArray(res.value)) return res.value;
  } catch(e) {}
  return [];
}
async function saveDexParent(data) {
  try {
    await dexParentReq('set', { key: DEX_STORAGE_KEY, value: data });
  } catch(e) {}
}

// ── ① localStorage ────────────────────────────────────────────────────────────
function getSavedDex() {
  try {
    const stored = localStorage.getItem(DEX_STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch(e) {
    console.warn('[DEX] localStorage 読み込み失敗:', e);
  }
  return [];
}
function saveDex(data) {
  try {
    localStorage.setItem(DEX_STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('[DEX] localStorage 保存失敗:', e);
  }
}

// ── ② IndexedDB（トランザクション完了を正しく待つ版） ────────────────────────────
function getDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('SicoCraneDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('storage')) db.createObjectStore('storage');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}
async function loadDexIDB() {
  try {
    const db = await getDB();
    return new Promise(resolve => {
      const tx    = db.transaction('storage', 'readonly');
      const store = tx.objectStore('storage');
      const req   = store.get(DEX_STORAGE_KEY);
      req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
      req.onerror   = () => resolve([]);
    });
  } catch(e) { return []; }
}
async function saveDexIDB(data) {
  try {
    const db = await getDB();
    await new Promise((resolve, reject) => {
      const tx    = db.transaction('storage', 'readwrite');
      const store = tx.objectStore('storage');
      store.put(data, DEX_STORAGE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror    = () => reject(tx.error);
      tx.onabort    = () => reject(tx.error);
    });
  } catch(e) {
    console.warn('[DEX] IndexedDB 保存失敗:', e);
  }
}

// ── ③ Cookie（180日有効・サードパーティ制限の影響を受けにくい最終手段） ───────────
function getDexCookie() {
  try {
    const match = document.cookie.split('; ').find(r => r.startsWith(DEX_COOKIE_KEY + '='));
    if (match) {
      const parsed = JSON.parse(decodeURIComponent(match.split('=').slice(1).join('=')));
      if (Array.isArray(parsed)) return parsed;
    }
  } catch(e) {}
  return [];
}
function saveDexCookie(data) {
  try {
    const expires = new Date(Date.now() + 180 * 24 * 60 * 60 * 1000).toUTCString();
    // SameSite=None; Secure はiframe/クロスサイトCookieに必要
    const secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = DEX_COOKIE_KEY + '=' + encodeURIComponent(JSON.stringify(data))
      + '; expires=' + expires + '; path=/' + '; SameSite=None' + secure;
  } catch(e) {
    console.warn('[DEX] Cookie 保存失敗:', e);
  }
}

// ── 全ストレージへの一括保存ユーティリティ ────────────────────────────────────────
async function saveAllDexStores(data) {
  saveDex(data);          // localStorage（同期）
  saveDexCookie(data);    // Cookie（同期）
  await saveDexIDB(data); // IndexedDB（非同期・完了待ち）
  saveDexParent(data);    // 親フレーム（非同期・fire-and-forget）
}

let collectedMonsters = [];

// 起動時: 全ストレージからデータを統合して初期化
async function initDexData() {
  const local  = getSavedDex();
  const cookie = getDexCookie();
  const idb    = await loadDexIDB();
  const parent = await loadDexParent();
  collectedMonsters = Array.from(new Set([...local, ...cookie, ...idb, ...parent]));
  console.log('[DEX] 初期化完了。取得済み:', collectedMonsters.length, '件');
  await saveAllDexStores(collectedMonsters); // 統合結果を全ストレージに書き戻す
}

// 獲得時の保存処理（全ストレージに保存）
async function saveToDex(id) {
  // 起動後に他のタブ等で変更がある可能性を考慮し、常に最新を取得してからマージ
  const idb    = await loadDexIDB();
  const local  = getSavedDex();
  const cookie = getDexCookie();
  const merged = Array.from(new Set([...collectedMonsters, ...idb, ...local, ...cookie]));
  if (!merged.includes(id)) {
    merged.push(id);
    console.log('[DEX] 新規追加:', id);
  }
  collectedMonsters = merged;
  await saveAllDexStores(collectedMonsters);
  console.log('[DEX] 保存完了。合計:', collectedMonsters.length, '件');
}
// ─────────────────────────────────────────────────────────

async function loadParentBalance() {
  if (!CRANE_EMBEDDED) {
    user.points = 5000000;
    updatePointsDisplay();
    return;
  }

  // 残高照会（delta=0）
  const res = await craneReq('crane:points:update', { delta: 0, reason: '残高確認', refId: 'init-' + Date.now() }, 9000);

  if (res.ok) {
    user.points = Math.max(0, Math.round(Number(res.balance) || 0));
  } else {
    user.points = 0;
  }
  
  updatePointsDisplay();
}

async function recordPointTransaction(delta, reason, refId) {
  const cleanDelta = Math.round(Number(delta) || 0);
  if (cleanDelta === 0) return { ok: true, balance: user.points };
  if (!CRANE_EMBEDDED) {
    user.points = Math.max(0, user.points + cleanDelta);
    updatePointsDisplay();
    return { ok: true, balance: user.points };
  }
  const res = await craneReq('crane:points:update', { delta: cleanDelta, reason: reason || 'CraneGame', refId: refId || ('crane-' + Date.now()) }, 9000);
  if (res.ok) {
    user.points = Math.max(0, Math.round(Number(res.balance) || 0));
    updatePointsDisplay();
  }
  return res;
}

async function shareDexCount() {
  if (!CRANE_EMBEDDED) { alert('sicoX内から起動するとポストできます'); return; }
  const res = await craneReq('crane:tweet', { count: collectedMonsters.length, total: 30 }, 7000);
  if (res.ok) alert('sicoXにポストしました！');
  else alert(res.error || 'ポストに失敗しました');
}
window.shareDexCount = shareDexCount;

const machines = {
  1: { cost: 100,     reward: 10000,      difficultyMul: 1.0,
       theme: {
         bg1: '#ff4081', bg2: '#ff79b0',        
         floor: 0xe0f7fa,                         
         hole: 0xff3366,                           
         rodColor: 0x888888, bodyColor: 0xffea00, 
         armColor: 0xdddddd, jointColor: 0x333333,
         uiBorder: '#00e5ff', label: '【ノーマル】'
       }
  },
  2: { cost: 1000000, reward: 100000000,  difficultyMul: 1.5,
       theme: {
         bg1: '#1a0533', bg2: '#2d0b5e',
         floor: 0x1a1a2e,
         hole: 0xaa00ff,
         rodColor: 0xc0a000, bodyColor: 0xffd700,
         armColor: 0xffd700, jointColor: 0x886600,
         uiBorder: '#ffd700', label: '【VIP】'
       }
  }
};

let currentMachineId = 1;
let gameState = "idle";
let currentPrizeData = null;

// ==========================================
// 2. モンスター生成関数群 (30体)
// ==========================================
function _createPart(group, geometry, color, position=[0,0,0], rotation=[0,0,0], scale=[1,1,1], materialProps={}) {
  const mat = new THREE.MeshLambertMaterial({ color, ...materialProps });
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.position.set(...position); mesh.rotation.set(...rotation); mesh.scale.set(...scale);
  mesh.castShadow = true; group.add(mesh); return mesh;
}

// 3. 図鑑 & キャラプレビュー
// ==========================================
function renderMonsterToDataURL(monData, size) {
  const offCanvas = document.createElement('canvas');
  offCanvas.width = size; offCanvas.height = size;
  const r = new THREE.WebGLRenderer({ canvas: offCanvas, antialias: true, alpha: false });
  r.setSize(size, size);
  r.setClearColor(0x1a1a2e, 1);
  const s = new THREE.Scene();
  s.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(3, 5, 3); s.add(dl);
  const mesh = monData.gen();
  const box = new THREE.Box3().setFromObject(mesh);
  const center = new THREE.Vector3(); box.getCenter(center);
  mesh.position.sub(center);
  s.add(mesh);
  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  const bsize = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(bsize.x, bsize.y, bsize.z);
  cam.position.set(maxDim * 1.2, maxDim * 0.8, maxDim * 1.5);
  cam.lookAt(0, 0, 0);
  r.render(s, cam);
  const url = offCanvas.toDataURL('image/png');
  r.dispose();
  return url;
}

window.openDex = async () => {
  const grid = document.getElementById('dex-grid');
  grid.innerHTML = '';
  
  // 開く時点でも最新を反映させる（全ストレージとメモリデータを統合）
  let storedDex = getSavedDex();
  let idbDex    = await loadDexIDB();
  let cookieDex = getDexCookie();
  let parentDex = await loadDexParent();
  collectedMonsters = Array.from(new Set([...collectedMonsters, ...storedDex, ...idbDex, ...cookieDex, ...parentDex]));
  
  monsterDB.forEach(m => {
    const div = document.createElement('div');
    const acquired = collectedMonsters.includes(m.id);
    div.className = 'dex-item ' + (acquired ? 'acquired' : '');
    if (acquired) {
      const img = document.createElement('img');
      img.src = renderMonsterToDataURL(m, 60);
      img.alt = m.name;
      div.appendChild(img);
      const lbl = document.createElement('div');
      lbl.innerText = m.name;
      div.appendChild(lbl);
      div.addEventListener('click', () => openCharModal(m));
    } else {
      div.innerText = '？？？';
    }
    grid.appendChild(div);
  });
  document.getElementById('dex-count').innerText = collectedMonsters.length;
  document.getElementById('dex-modal').classList.add('show');
};
window.closeDex = () => document.getElementById('dex-modal').classList.remove('show');

// ★ キャラクター詳細 - 回転プレビュー
let charRAF = null;
let charPreviewR = null;

window.openCharModal = function(monData) {
  if (charRAF) { cancelAnimationFrame(charRAF); charRAF = null; }
  if (charPreviewR) { charPreviewR.dispose(); charPreviewR = null; }

  document.getElementById('char-modal-name').innerText = monData.name;
  document.getElementById('char-modal-num').innerText = `No.${monData.index + 1} / 30`;
  document.getElementById('char-modal').classList.add('show');

  const canvas = document.getElementById('char-preview-canvas');
  charPreviewR = new THREE.WebGLRenderer({ canvas, antialias: true });
  charPreviewR.setSize(220, 220);
  charPreviewR.setClearColor(0x1a1a2e, 1);

  const s = new THREE.Scene();
  s.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dl1 = new THREE.DirectionalLight(0xffffff, 0.9); dl1.position.set(4, 6, 4); s.add(dl1);
  const dl2 = new THREE.DirectionalLight(0x88aaff, 0.4); dl2.position.set(-3, 2, -2); s.add(dl2);

  const mesh = monData.gen();
  mesh.scale.set(1.1, 1.1, 1.1);
  const box = new THREE.Box3().setFromObject(mesh);
  const center = new THREE.Vector3(); box.getCenter(center);
  mesh.position.sub(center);
  s.add(mesh);

  const bsize = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(bsize.x, bsize.y, bsize.z);
  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  cam.position.set(maxDim * 1.4, maxDim * 0.9, maxDim * 1.8);
  cam.lookAt(0, 0, 0);

  (function loop() {
    charRAF = requestAnimationFrame(loop);
    mesh.rotation.y += 0.018;
    charPreviewR.render(s, cam);
  })();
};

window.closeCharModal = function() {
  if (charRAF) { cancelAnimationFrame(charRAF); charRAF = null; }
  if (charPreviewR) { charPreviewR.dispose(); charPreviewR = null; }
  document.getElementById('char-modal').classList.remove('show');
};

const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.shadowMap.enabled = true;

// ─── ゲームエリア高さ（コントロールパネル分を除く）──────────
function getGameHeight() {
  const ctrl = document.getElementById('controls');
  const ctrlH = ctrl ? Math.max(ctrl.getBoundingClientRect().height, 100) : 120;
  const safeBottom = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--sab') || '0'
  ) || 0;
  return Math.max(200, window.innerHeight - ctrlH - safeBottom - 10);
}
function resizeRenderer() {
  const W = window.innerWidth;
  const H = getGameHeight();
  document.documentElement.style.setProperty('--game-h', H + 'px');
  renderer.setSize(W, H);
  renderer.domElement.style.width  = W + 'px';
  renderer.domElement.style.height = H + 'px';
  camera.aspect = W / H;
  
  const isNarrow = W < 480 || W < H;
  camera.fov = isNarrow ? 75 : 60;
  if (!isSideView) {
    const dist = isNarrow ? 14 : 11;
    const yPos = isNarrow ? 9 : 8;
    camera.position.set(0, yPos, dist);
    camera.lookAt(0, 0, 0);
    CAMERA_FRONT.pos.set(0, yPos, dist);
  }
  camera.updateProjectionMatrix();
}

let prizeMesh = null;

const PRIZE_MASS   = 10.0;
const FRICTION     = 0.88;
const FIELD_HALF   = 7.0;

function getArmTipWorld(armGroup, baseLocalX, baseLocalY) {
  armGroup.updateMatrixWorld(true);
  const v = new THREE.Vector3(baseLocalX, baseLocalY, 0);
  return v.applyMatrix4(armGroup.matrixWorld);
}

function getArmTips() {
  craneGroup.updateMatrixWorld(true);
  const tipL = getArmTipWorld(armL, -0.30, -2.05);
  const tipR = getArmTipWorld(armR,  0.30, -2.05);
  return { tipL, tipR };
}

const guide = document.getElementById('guide');
function updateGuide(text) { guide.innerText = text; }

let isMovingRight = false, isMovingUp = false, dropTween = null;
let isCatched = false;

let gummyDeformT = 0;
let isArmTouching = false;

let storedGripScore = 0;
let storedHoldQuality = 0;
let liftTweenRef = null;
let hasSlipped = false;

function updateGummyDeform() {
  if (!prizeMesh || prizeMesh.parent !== scene) return;
  if (isArmTouching) {
    gummyDeformT = Math.min(1, gummyDeformT + 0.10);
  } else {
    gummyDeformT = Math.max(0, gummyDeformT - 0.18);
  }
  if (gummyDeformT > 0) {
    const squish  = 1 - gummyDeformT * 0.10;
    const stretch = 1 + gummyDeformT * 0.08;
    prizeMesh.scale.set(1.2 * squish, 1.2 * stretch, 1.2 * squish);
  } else {
    prizeMesh.scale.set(1.2, 1.2, 1.2);
  }
  isArmTouching = false;
}

function checkArmPrizeCollision() {
  if (!prizeMesh || gameState !== "dropping") return;

  const { tipL, tipR } = getArmTips();
  const prizePos = prizeMesh.position;
  const clawCenterX = (tipL.x + tipR.x) * 0.5;
  const clawCenterZ = (tipL.z + tipR.z) * 0.5;
  const clawSpanX   = Math.abs(tipR.x - tipL.x);
  const insideClawX = Math.abs(prizePos.x - clawCenterX) < clawSpanX * 0.5;
  const armTipRadius = 0.07;
  const hitThreshold = prizeRadius + armTipRadius;
  let touched = false;

  for (const tip of [tipL, tipR]) {
    const dx = prizePos.x - tip.x;
    const dy = prizePos.y - tip.y;
    const dz = prizePos.z - tip.z;
    const dist3D = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist3D < hitThreshold) {
      if (insideClawX) continue;
      const distXZ = Math.sqrt(dx*dx + dz*dz);
      if (distXZ > 0.03) {
        touched = true;
        const impactForce = 0.018 / PRIZE_MASS;
        prizeVelX += (dx / distXZ) * impactForce;
        prizeVelZ += (dz / distXZ) * impactForce;
        prizeAngVelX +=  (dz / distXZ) * impactForce * 0.12;
        prizeAngVelZ -= (dx / distXZ) * impactForce * 0.12;
      }
    }
  }
  if (touched) isArmTouching = true;
}

function startDrop() {
  gameState = "dropping";
  updateGuide("もう一度「◎」でその高さでストップ！");
  gsap.to(armL.rotation, { z: -0.72, duration: 0.35 });

function executeCatch() {
  gameState = "catching";
  document.getElementById('btn-drop').disabled = true;
  updateGuide("アームが閉じる！");
  gsap.to(armL.rotation, { z: 0, duration: 0.30, ease: "power2.in" });
  gsap.to(armR.rotation, { z: 0, duration: 0.30, ease: "power2.in", onComplete: evaluateGrip });
}

function evaluateGrip() {
  if (!prizeMesh) { isCatched = false; beginReturn(); return; }

  craneGroup.updateMatrixWorld(true);
  const grabL = getArmTipWorld(armL, -0.10, -1.50);
  const grabR = getArmTipWorld(armR,  0.10, -1.50);
  const armCenter = new THREE.Vector3().addVectors(grabL, grabR).multiplyScalar(0.5);
  const prizePos  = prizeMesh.position;

  const dxz = Math.sqrt((armCenter.x - prizePos.x) ** 2 + (armCenter.z - prizePos.z) ** 2);
  const dy  = Math.abs(armCenter.y - prizePos.y);

  const maxXZ = 1.25;
  const maxY  = 1.10;

  if (dxz >= maxXZ || dy >= maxY) {
    isCatched = false;
    updateGuide("アームが届かなかった...");
    beginReturn();
    return;
  }

  const xzScore = Math.max(0, 1 - dxz / maxXZ);
  const yScore  = Math.max(0, 1 - dy  / maxY);
  storedGripScore = xzScore * yScore;

  const clawForce = 0.35 + Math.random() * 0.50;
  storedHoldQuality = (storedGripScore * clawForce) / machines[currentMachineId].difficultyMul;

  if (storedHoldQuality < 0.04) {
    isCatched = false;
    updateGuide("掴めなかった！");
    const dx = prizePos.x - armCenter.x, dz = prizePos.z - armCenter.z;
    const len = Math.sqrt(dx*dx + dz*dz) + 0.001;
    prizeVelX += (dx / len) * 0.025 / PRIZE_MASS;
    prizeVelZ += (dz / len) * 0.025 / PRIZE_MASS;
    beginReturn();
    return;
  }

  isCatched = true;
  attachPrizeToCrane();
  beginLift();
}

function attachPrizeToCrane() {
  const wp = new THREE.Vector3(); prizeMesh.getWorldPosition(wp);
  const wq = new THREE.Quaternion(); prizeMesh.getWorldQuaternion(wq);
  craneGroup.add(prizeMesh);
  craneGroup.updateMatrixWorld(true);
  const invMat = new THREE.Matrix4().copy(craneGroup.matrixWorld).invert();
  const localPos = wp.clone().applyMatrix4(invMat);
  prizeMesh.position.copy(localPos);
  prizeMesh.quaternion.copy(wq);
}

function beginLift() {
  hasSlipped = false;
  updateGuide("持ち上げ中...");

  if (storedHoldQuality < 0.35) {
    gsap.to(prizeMesh.position, {
      y: prizeMesh.position.y - 0.18,
      duration: 0.18, yoyo: true, repeat: 2, ease: "power2.out"
    });
  }

  const liftTime = 1.9;
  liftTweenRef = gsap.to(craneGroup.position, {
    y: 5, duration: liftTime, ease: "power1.inOut",
    onComplete: () => {
      if (!hasSlipped && isCatched) {
        beginCarry();
      }
    }
  });
}

function beginCarry() {
  updateGuide("穴へ運ぶ！");

  const carryTime = 2.1;
  let carryTween = gsap.to(craneGroup.position, {
    x: -4.5, z: 4.5, duration: carryTime, ease: "power1.inOut",
    onComplete: finishTurn
  });

  const slipProb = Math.max(0, 0.78 - storedHoldQuality * 1.0);

  [carryTime * 0.25, carryTime * 0.55, carryTime * 0.85].forEach(t => {
    gsap.delayedCall(t, () => {
      if (hasSlipped || !isCatched || gameState !== "catching") return;
      if (Math.random() < slipProb) {
        hasSlipped = true;
        doSlip();
      }
    });
  });
}

function doSlip() {
  isCatched = false;
  if (prizeMesh && prizeMesh.parent === craneGroup) {
    const craneWP = new THREE.Vector3();
    craneGroup.getWorldPosition(craneWP);
    scene.add(prizeMesh);
    prizeMesh.position.set(craneWP.x, targetY, craneWP.z);
    prizeMesh.scale.set(1.2, 1.2, 1.2);
    const toDirX = (-4.5 - craneWP.x);
    const toDirZ = ( 4.5 - craneWP.z);
    const len = Math.sqrt(toDirX*toDirX + toDirZ*toDirZ) + 0.001;
    prizeVelX = (toDirX / len) * 0.018 + (Math.random() - 0.5) * 0.03;
    prizeVelZ = (toDirZ / len) * 0.018 + (Math.random() - 0.5) * 0.03;
    prizeAngVelZ = (Math.random() - 0.5) * 0.022;
  }
  updateGuide("あ！すべった...");
}

function beginReturn() {
  gsap.to(craneGroup.position, { y: 5, duration: 1.2, ease: "power1.inOut", onComplete: finishTurn });
}

function finishTurn() {
  gsap.to(armL.rotation, { z: -0.22, duration: 0.5 });
  gsap.to(armR.rotation, { z:  0.22, duration: 0.5 });

  if (isCatched && prizeMesh && prizeMesh.parent === craneGroup) {
    const wp = new THREE.Vector3(); prizeMesh.getWorldPosition(wp);
    const wq = new THREE.Quaternion(); prizeMesh.getWorldQuaternion(wq);
    scene.add(prizeMesh);
    prizeMesh.position.copy(wp);
    prizeMesh.quaternion.copy(wq);
    gsap.to(prizeMesh.position, {
      x: -4.5, z: 4.5, y: 1.5, duration: 0.35, ease: "power1.inOut",
      onComplete: () => {
        gsap.to(prizeMesh.position, { y: -3, duration: 0.65, ease: "power2.in", onComplete: showWinEffect });
      }
    });
  } else {
    setTimeout(() => resetGame(false), 900);
  }
}

// 8. アニメーションループ
// ==========================================
const ACTIVE_STATES = new Set(["idle","ready","movingRight","movingUp","waitDrop","dropping","catching"]);

function animate() {
  requestAnimationFrame(animate);

  if (isMovingRight && craneGroup.position.x < 5.5) craneGroup.position.x += 0.06;
  if (isMovingUp && craneGroup.position.z > -5.5) craneGroup.position.z -= 0.06;

  checkArmPrizeCollision();
  updateGummyDeform();

  if (prizeMesh && prizeMesh.parent === scene && ACTIVE_STATES.has(gameState)) {
    const moving = Math.abs(prizeVelX) > 0.0003 || Math.abs(prizeVelZ) > 0.0003;

    if (moving) {
      prizeMesh.position.x += prizeVelX;
      prizeMesh.position.z += prizeVelZ;

      if (prizeMesh.position.x > FIELD_HALF)  { prizeMesh.position.x = FIELD_HALF; prizeVelX *= -0.35; prizeVelZ *= 0.8; }
      if (prizeMesh.position.x < -FIELD_HALF) { prizeMesh.position.x = -FIELD_HALF; prizeVelX *= -0.35; prizeVelZ *= 0.8; }
      if (prizeMesh.position.z > FIELD_HALF)  { prizeMesh.position.z = FIELD_HALF; prizeVelZ *= -0.35; prizeVelX *= 0.8; }
      if (prizeMesh.position.z < -FIELD_HALF) { prizeMesh.position.z = -FIELD_HALF; prizeVelZ *= -0.35; prizeVelX *= 0.8; }

      prizeVelX *= FRICTION;
      prizeVelZ *= FRICTION;
    }

    const rotating = Math.abs(prizeAngVelX) > 0.0003 || Math.abs(prizeAngVelZ) > 0.0003;
    if (rotating) {
      prizeMesh.rotation.x += prizeAngVelX;
      prizeMesh.rotation.z += prizeAngVelZ;
      prizeAngVelX *= FRICTION;
      prizeAngVelZ *= FRICTION;
    }

    if (gameState === "idle" && !moving) {
      prizeMesh.rotation.y += 0.01;
    }

    prizeMesh.position.y = targetY;

    // 直接落下した際の判定
    const holeActiveStates = new Set(["idle","ready","movingRight","movingUp","waitDrop","dropping"]);
    if (holeActiveStates.has(gameState)) {
      const holeX = -4.5, holeZ = 4.5, holeHalf = 1.6;
      const px = prizeMesh.position.x, pz = prizeMesh.position.z;
      if (
        px > holeX - holeHalf && px < holeX + holeHalf &&
        pz > holeZ - holeHalf && pz < holeZ + holeHalf
      ) {
        isCatched = true;
        gameState = "catching";
        prizeVelX = 0; prizeVelZ = 0; prizeAngVelX = 0; prizeAngVelZ = 0;
        document.getElementById('btn-drop').disabled = true;
        if (dropTween) dropTween.kill();
        updateGuide("穴に落ちた！");
        gsap.to(prizeMesh.position, { y: -3, duration: 0.6, ease: "power2.in", onComplete: showWinEffect });
      }
    }
  }

  craneShadow.position.x = craneGroup.position.x;
  craneShadow.position.z = craneGroup.position.z;
  const heightRatio = Math.max(0, Math.min(1, (craneGroup.position.y - 2) / 5));
  shadowMat.opacity = 0.5 - heightRatio * 0.35;
  craneShadow.scale.setScalar(0.7 + heightRatio * 0.6);

  const camTarget = isSideView ? CAMERA_SIDE.look : CAMERA_FRONT.look;
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}

window.addEventListener('resize', resizeRenderer);

// 起動時にデータを初期化してからゲームループを開始
loadParentBalance()
  .then(() => initDexData())
  .then(() => { spawnPrize(true); animate(); })
  .catch(() => { 
    initDexData().then(() => { spawnPrize(true); animate(); }); 
  });

window.addEventListener('load', resizeRenderer);
</script>
</body>
</html>
