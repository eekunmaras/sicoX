<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SicoX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/eekunmaras/sicoX/main/logo2.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/eekunmaras/sicoX/main/logo2.png">
<meta name="apple-mobile-web-app-title" content="SicoX">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="SicoX">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{
  --bg:#000;--bg3:#111;--bg4:#181818;--border:#2f2f2f;
  --text:#e7e9ea;--text2:#71767b;--accent:#1d9bf0;--ah:#1a8cd8;
  --like:#f91880;--repost:#00ba7c;--font:'Noto Sans JP',sans-serif;--r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;justify-content:center;min-height:100vh;}

/* ── Demo bar ── */
.demo-bar{display:none !important;}
.demo-bar strong{color:var(--accent);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Layout ── */
.layout{display:flex;width:100%;max-width:1100px;}

/* ── Sidebar ── */
.sidebar{width:250px;padding:8px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--accent);padding:10px 14px;display:block;}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:9999px;cursor:pointer;font-size:16px;font-weight:500;color:var(--text);transition:background .15s;text-decoration:none;margin:1px 0;position:relative;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item svg{width:24px;height:24px;flex-shrink:0;}
.nav-badge{position:absolute;top:6px;left:28px;background:var(--like);color:#fff;border-radius:9999px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:none;align-items:center;justify-content:center;padding:0 4px;}
.user-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:9999px;cursor:pointer;transition:background .15s;margin-bottom:8px;}
.user-chip:hover{background:rgba(255,255,255,.08);}

/* ── Avatar ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.av-80{width:80px;height:80px;font-size:26px;}
.av-48{width:48px;height:48px;font-size:18px;}
.av-44{width:44px;height:44px;font-size:16px;}
.av-40{width:40px;height:40px;font-size:14px;}
.av-32{width:32px;height:32px;font-size:12px;}
.av-c{cursor:pointer;transition:opacity .15s;}
.av-c:hover{opacity:.8;}

/* ── Main ── */
.main{flex:1;max-width:600px;border-right:1px solid var(--border);height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;}
.view{display:none;flex-direction:column;}
.view.active{display:flex;min-height:100%;}
#view-dm-chat{display:none;flex-direction:column;}
#view-dm-chat.active{display:flex;flex-direction:column;min-height:unset;height:100%;overflow:hidden;}
#view-dm-chat #dm-new-msg-bar{flex-shrink:0;}
#view-dm-chat.active .dm-chat-wrap{flex:1;min-height:0;}

/* ── Feed header ── */
.feed-header{position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:52px;}.feed-header-title{font-size:17px;font-weight:700;flex:1;}
.back-btn{background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.back-btn:hover,.back-btn:active{background:rgba(255,255,255,.1);}
.back-btn svg{width:20px;height:20px;}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:14px 8px;text-align:center;font-size:15px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s,color .15s;border-bottom:3px solid transparent;margin-bottom:-1px;user-select:none;letter-spacing:.01em;}
.tab:hover{background:rgba(255,255,255,.05);color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700;}
/* Feed tabs sticky — relative to .main scroll container */
#view-feed .tabs{position:sticky;top:52px;z-index:9;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);}

/* ── New posts banner ── */
/* .new-posts-bar は body直下のinline styleで管理 */
#new-posts-bar:hover{background:var(--ah) !important;}

/* ── Name banner ── */
.name-banner{background:rgba(29,155,240,.08);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.name-banner p{font-size:13px;flex:1;min-width:120px;}
.txt-sm{background:var(--bg3);border:1px solid var(--border);border-radius:9999px;color:var(--text);font-family:var(--font);font-size:14px;padding:6px 12px;outline:none;}
.txt-sm:focus{border-color:var(--accent);}
.set-btn{background:var(--accent);color:#fff;border:none;border-radius:9999px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);}

/* ── Compose ── */
.compose-box{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.compose-right{flex:1;min-width:0;}
.compose-ta{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:17px;resize:none;min-height:54px;line-height:1.5;}
.compose-ta::placeholder{color:var(--text2);}
.compose-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:8px;border-top:1px solid var(--border);}
.compose-tools{display:flex;gap:2px;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.icon-btn:active{background:rgba(29,155,240,.2);}
.icon-btn svg{width:19px;height:19px;}
.char-count{font-size:13px;color:var(--text2);min-width:26px;text-align:right;}
.char-count.warn{color:#ffd700;}.char-count.danger{color:var(--like);}
.post-btn{background:var(--accent);color:#fff;border:none;border-radius:9999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);}
.post-btn:active{background:var(--ah);}
.post-btn:disabled{opacity:.45;cursor:not-allowed;}
.img-pw{margin-top:8px;border-radius:var(--r);display:none;gap:6px;flex-wrap:wrap;}
.img-pw-item{position:relative;border-radius:10px;overflow:hidden;flex:0 0 calc(50% - 3px);max-width:calc(50% - 3px);}
.img-pw-item:only-child{flex:0 0 100%;max-width:100%;}
.img-pw-item img{width:100%;height:100px;object-fit:cover;display:block;}
.img-pw-item:only-child img{height:200px;}
.img-remove{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.up-status{font-size:11px;color:var(--text2);margin-top:3px;display:none;}

/* ── Quoted tweet (compose) ── */
.quote-preview{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:8px;font-size:13px;color:var(--text2);position:relative;}
.quote-preview-author{font-weight:700;color:var(--text);font-size:13px;margin-bottom:2px;}
.quote-remove{position:absolute;top:6px;right:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:16px;}

/* ── Tweet card ── */
.tweet-card{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.tweet-card:active{background:rgba(255,255,255,.04);}
@media(hover:hover){.tweet-card:hover{background:rgba(255,255,255,.03);}}
.repost-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:4px;padding-left:54px;}
.repost-label svg{width:14px;height:14px;color:var(--repost);}
.tweet-right{flex:1;min-width:0;}
.tweet-header{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;}
.tw-name{font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;}
.tw-name:hover{text-decoration:underline;}
.tw-handle{color:var(--text2);font-size:12px;cursor:pointer;flex-shrink:0;}
.tw-handle:hover{text-decoration:underline;}
.tw-time{color:var(--text2);font-size:11px;margin-left:auto;}
.tweet-body{font-size:14px;line-height:1.65;margin-top:3px;word-break:break-word;white-space:pre-wrap;}
.tweet-img{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.tweet-img img{width:100%;max-height:300px;object-fit:cover;display:block;}
/* ── Multi-image grid ── */
.img-grid{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--border);display:grid;gap:2px;cursor:pointer;max-width:280px;}
.img-grid.g1{grid-template-columns:1fr;}
.img-grid.g2{grid-template-columns:1fr 1fr;}
.img-grid.g3{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
.img-grid.g4{grid-template-columns:1fr 1fr;}
.img-grid img{width:100%;object-fit:cover;display:block;}
.img-grid.g1 img{max-height:160px;}
.img-grid.g2 img,.img-grid.g3 img,.img-grid.g4 img{height:90px;}
.img-grid.g3 img:first-child{grid-column:1/3;height:110px;}
.img-grid-more{position:relative;}
.img-grid-more::after{content:attr(data-more);position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;}
/* ── Lightbox ── */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:14px;right:18px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:22px;cursor:pointer;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:none;color:#fff;font-size:24px;cursor:pointer;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.lightbox-prev{left:14px;}.lightbox-next{right:14px;}
.lightbox-prev:hover,.lightbox-next:hover{background:rgba(0,0,0,.8);}
.lightbox-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px;}
.reply-badge{font-size:11px;color:var(--text2);margin-bottom:2px;}
.reply-badge em{color:var(--accent);font-style:normal;cursor:pointer;}

/* ── Quote embed ── */
.quote-embed{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:8px;cursor:pointer;}
.quote-embed:hover{background:rgba(255,255,255,.03);}
.quote-embed-header{font-size:12px;color:var(--text2);margin-bottom:3px;}
.quote-embed-header strong{color:var(--text);}
.quote-embed-body{font-size:13px;line-height:1.5;color:var(--text);}

/* ── Link preview ── */
.link-preview{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:8px;cursor:pointer;transition:background .15s;}
.link-preview:hover{background:rgba(255,255,255,.04);}
.link-preview-thumb{width:100%;height:160px;object-fit:cover;display:block;background:var(--bg3);}
.link-preview-body{padding:10px 12px;}
.link-preview-domain{font-size:11px;color:var(--text2);margin-bottom:2px;}
.link-preview-title{font-size:14px;font-weight:700;line-height:1.3;}
.link-preview-loading{padding:14px;font-size:13px;color:var(--text2);}

/* ── Tweet actions ── */
.tweet-actions{display:flex;gap:0;margin-top:8px;margin-left:-6px;}
.act-btn{display:flex;align-items:center;gap:4px;background:transparent;border:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);padding:4px 8px;border-radius:9999px;transition:color .15s,background .15s;min-width:44px;}
.act-btn svg{width:16px;height:16px;}
.act-btn:hover{color:var(--accent);background:rgba(29,155,240,.08);}
.act-btn:active{background:rgba(29,155,240,.15);}
.act-btn.like:hover{color:var(--like);background:rgba(249,24,128,.08);}
.act-btn.liked{color:var(--like);}
.act-btn.liked svg{fill:var(--like);stroke:var(--like);}
.act-btn.reposted{color:var(--repost);}
.act-btn.reposted svg{stroke:var(--repost);}

/* ── Poll ── */
.poll{margin-top:8px;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.poll-option{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative;font-size:14px;}
.poll-option:last-child{border-bottom:none;}
.poll-option:hover{background:rgba(29,155,240,.06);}
.poll-option.voted{cursor:default;}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(29,155,240,.18);border-radius:0;transition:width .4s ease;}
.poll-option-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;}
.poll-pct{font-size:12px;color:var(--text2);font-weight:700;}
.poll-winner .poll-bar{background:rgba(29,155,240,.28);}
.poll-winner .poll-option-inner{font-weight:700;}
.poll-meta{font-size:12px;color:var(--text2);padding:8px 14px;border-top:1px solid var(--border);}

/* ── Poll compose ── */
.poll-compose{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px;}
.poll-compose-title{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600;}
.poll-option-input{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.poll-option-input input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:7px 10px;outline:none;}
.poll-option-input input:focus{border-color:var(--accent);}
.poll-option-input button{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.add-poll-opt{font-size:13px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:var(--font);padding:4px 0;}

/* ── Blocked overlay ── */
.blocked-card{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:space-between;}

/* ── Thread view ── */
.thread-parent{padding:14px 16px;border-bottom:1px solid var(--border);}
.thread-parent .tweet-body{font-size:16px;margin-top:10px;}
.tw-time-full{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.thread-stats{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:8px;}
.stat-item{font-size:13px;color:var(--text2);} .stat-item strong{color:var(--text);}
.thread-actions{display:flex;border-bottom:1px solid var(--border);}
.thread-actions .act-btn{flex:1;justify-content:center;padding:10px 4px;font-size:13px;}
.reply-compose-thread{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.reply-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 12px;resize:none;outline:none;min-height:68px;}
.reply-ta:focus{border-color:var(--accent);}

/* ── User page ── */
.user-cover{height:130px;position:relative;}
.user-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.user-cover-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#1a3a5c,#0d1f2d);}
.user-profile-header{padding:0 16px 12px;}
.user-edit-bar{display:flex;justify-content:flex-end;padding:10px 0 4px;gap:8px;}
.user-av-wrap{margin-top:-46px;margin-bottom:8px;display:inline-block;position:relative;z-index:2;}
.user-av-wrap .av{border:4px solid var(--bg);}
.user-bio{font-size:14px;margin-top:6px;color:var(--text);line-height:1.5;}
.profile-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:10px;}
/* User page action buttons */
.up-action-btn{border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font);font-size:14px;font-weight:700;border-radius:9999px;padding:6px 16px;cursor:pointer;transition:background .15s;}
.up-action-btn:hover{background:rgba(255,255,255,.08);}
.up-action-btn.danger{color:var(--like);border-color:var(--like);}
.up-action-btn.danger:hover{background:rgba(249,24,128,.08);}
.up-action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.up-action-btn.primary:hover{background:var(--ah);}

/* ── DM ── */
.dm-list-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.dm-list-item:hover{background:rgba(255,255,255,.03);}
.dm-preview{flex:1;min-width:0;}
.dm-name-row{display:flex;justify-content:space-between;align-items:baseline;}
.dm-preview-text{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.dm-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.dm-chat-wrap{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;}
.dm-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;}
.dm-bubble{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.dm-bubble.mine{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.dm-bubble.theirs{background:var(--bg3);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;}
.dm-btime{font-size:11px;opacity:.7;margin-top:2px;}
.dm-input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;}
.dm-ta{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:22px;color:var(--text);font-family:var(--font);font-size:14px;padding:8px 14px;outline:none;resize:none;max-height:120px;line-height:1.4;}
.dm-ta:focus{border-color:var(--accent);}
.dm-send-btn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end;}
.dm-send-btn:disabled{opacity:.4;cursor:not-allowed;}
.dm-send-btn svg{width:17px;height:17px;}
.dm-new-btn{margin:14px 16px;background:var(--accent);color:#fff;border:none;border-radius:9999px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);width:calc(100% - 32px);}

/* ── Right sidebar ── */
.right-sidebar{width:300px;padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;}
.search-box{background:var(--bg3);border:1px solid transparent;border-radius:9999px;display:flex;align-items:center;gap:8px;padding:8px 14px;margin-bottom:14px;transition:border-color .15s,background .15s;}
.search-box:focus-within{background:var(--bg);border-color:var(--accent);}
.search-box svg{width:16px;height:16px;color:var(--text2);flex-shrink:0;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:14px;width:100%;}
.search-box input::placeholder{color:var(--text2);}
.widget{background:var(--bg3);border-radius:var(--r);padding:14px;margin-bottom:14px;}
.widget-title{font-size:16px;font-weight:700;margin-bottom:10px;}
.member-item{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;}
.member-item:hover .mem-name{text-decoration:underline;}
.mem-name{font-size:13px;font-weight:500;}
.mem-handle{font-size:11px;color:var(--text2);}
.empty-msg{text-align:center;color:var(--text2);padding:40px 16px;font-size:14px;line-height:2.2;}

/* ── Users search view ── */
.user-search-box{display:flex;align-items:center;gap:10px;margin:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:9999px;padding:9px 16px;transition:border-color .15s;}
.user-search-box:focus-within{border-color:var(--accent);}
.user-search-box svg{width:16px;height:16px;color:var(--text2);flex-shrink:0;}
.user-search-box input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:15px;width:100%;}
.user-search-box input::placeholder{color:var(--text2);}
.user-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.user-card:hover{background:rgba(255,255,255,.03);}
.user-card-info{flex:1;min-width:0;}
.user-card-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-card-handle{font-size:13px;color:var(--text2);}
.user-card-bio{font-size:13px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-card-dm{background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13px;font-weight:700;border-radius:9999px;padding:5px 14px;cursor:pointer;flex-shrink:0;transition:background .15s;}
.user-card-dm:hover{background:rgba(255,255,255,.08);}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
body.modal-open{overflow:hidden;}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);width:95%;max-width:520px;padding:20px;position:relative;margin-bottom:40px;}
.modal-close{position:absolute;top:10px;right:12px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:20px;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,.08);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;}
.field-label{font-size:12px;color:var(--text2);margin-bottom:3px;}
.txt-field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:14px;padding:9px 12px;outline:none;margin-bottom:10px;}
.txt-field:focus{border-color:var(--accent);}
.handle-wrap{position:relative;margin-bottom:10px;}
.handle-wrap .pfx{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px;pointer-events:none;}
.handle-wrap input{padding-left:24px;}
.av-edit-wrap{position:relative;width:72px;height:72px;margin:0 auto 12px;}
.av-edit-wrap .av{width:72px;height:72px;font-size:24px;}
.av-edit-btn{position:absolute;bottom:0;right:-2px;background:var(--bg);border:2px solid var(--bg);border-radius:50%;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);background:var(--bg3);}
.av-edit-btn svg{width:12px;height:12px;}
.cover-edit-wrap{width:100%;height:80px;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;margin-bottom:12px;background:linear-gradient(135deg,#1a3a5c,#0d1f2d);}
.cover-edit-wrap img{width:100%;height:100%;object-fit:cover;}
.cover-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;gap:6px;}
.cover-edit-overlay svg{width:16px;height:16px;}

/* ── Repost modal ── */
.repost-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-radius:10px;transition:background .15s;font-size:15px;font-weight:500;}
.repost-opt:hover{background:rgba(255,255,255,.06);}
.repost-opt svg{width:20px;height:20px;}
.repost-cancel-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:11px 16px;margin-top:4px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text2);font-family:var(--font);font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;}
.repost-cancel-btn:hover{background:rgba(255,255,255,.06);color:var(--text);}

/* ── Block menu ── */
.ctx-menu{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.6);z-index:500;min-width:220px;overflow:hidden;}
.ctx-item{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:500;transition:background .15s;display:flex;align-items:center;gap:10px;}
.ctx-item:hover{background:rgba(255,255,255,.06);}
.ctx-item.danger{color:var(--like);}
.ctx-item svg{width:18px;height:18px;}

/* ── Toast ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 20px;border-radius:9999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;z-index:600;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* ── Mobile nav ── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.95);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0;z-index:50;justify-content:space-around;safe-area-inset-bottom:env(safe-area-inset-bottom);}
.mobile-nav button{background:transparent;border:none;color:var(--text);cursor:pointer;padding:6px 14px;position:relative;display:flex;flex-direction:column;align-items:center;}
.mobile-nav button svg{width:24px;height:24px;}
.mob-badge{position:absolute;top:2px;right:6px;background:var(--like);color:#fff;border-radius:9999px;font-size:9px;font-weight:700;min-width:15px;height:15px;display:none;align-items:center;justify-content:center;padding:0 3px;}

@media(max-width:1000px){.right-sidebar{display:none;}.sidebar{width:68px;}.nav-item span,.user-chip .user-info{display:none;}.nav-item{justify-content:center;padding:10px;}.logo{text-align:center;font-size:22px;}}
@media(max-width:640px){.sidebar{display:none;}.main{max-width:100%;border-right:none;min-width:0;height:calc(100vh - 54px - env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;}.mobile-nav{display:flex;}body{padding-bottom:calc(54px + env(safe-area-inset-bottom));}.modal-overlay{padding-top:20px;}.tweet-card{padding:10px 12px;}.compose-box{padding:10px 12px;}
#view-dm-list{display:none;flex-direction:column;height:100%;overflow-y:auto;}
#view-dm-list.active{display:flex;}
#view-dm-chat{position:fixed;top:0;left:0;right:0;bottom:0;height:100%;display:none;flex-direction:column;z-index:60;background:var(--bg);}
#view-dm-chat.active{display:flex;}
#view-dm-chat .feed-header{flex-shrink:0;}
#view-dm-chat #dm-new-msg-bar{flex-shrink:0;}
#view-dm-chat .dm-chat-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
#view-dm-chat .dm-messages{flex:1;overflow-y:auto;min-height:0;}
#view-dm-chat .dm-input-row{flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));}}
</style>
</head>
<body>
<div class="demo-bar" id="demo-bar"><div class="pulse"></div><strong id="demo-bar-label">接続中…</strong><span id="demo-bar-msg"></span></div>

<!-- ── 合言葉ゲート ── -->
<div id="gate" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:20px;">
  <div style="font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#1d9bf0;">
    <img src="https://raw.githubusercontent.com/eekunmaras/sicoX/main/logo.png" alt="SicoX" style="height:48px;width:auto;">
  </div>
  <div style="background:#111;border:1px solid #2f2f2f;border-radius:16px;padding:28px 32px;width:320px;display:flex;flex-direction:column;gap:14px;">
    <div style="font-size:15px;font-weight:600;color:#e7e9ea;">合言葉を入力してください</div>
    <input id="gate-input" type="password" placeholder="合言葉" autocomplete="off"
      style="background:#1c1c1c;border:1px solid #2f2f2f;border-radius:10px;padding:10px 14px;color:#e7e9ea;font-size:15px;font-family:inherit;outline:none;"
      onkeydown="if(event.key==='Enter')checkGate()">
    <div id="gate-error" style="color:#f91880;font-size:13px;display:none;">合言葉が違います</div>
    <button onclick="checkGate()"
      style="background:#1d9bf0;border:none;border-radius:9999px;color:#fff;font-size:15px;font-weight:700;padding:10px;cursor:pointer;font-family:inherit;">
      入室する
    </button>
  </div>
</div>

<div class="layout">
<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar">
  <span class="logo" onclick="goFeed();return false;" style="cursor:pointer;display:block;padding:10px 14px;">
    <img src="https://raw.githubusercontent.com/eekunmaras/sicoX/main/logo.png" alt="SicoX" style="height:32px;width:auto;display:block;">
  </span>
  <nav>
    <a class="nav-item" href="#" onclick="goFeed();return false;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9v13h7v-7h6v7h7V9z"/></svg><span>ホーム</span>
    </a>
    <a class="nav-item" href="#" onclick="goView('members');return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>ユーザーを探す</span>
    </a>
    <a class="nav-item" id="nav-dm" href="#" onclick="goView('dm-list');return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>メッセージ</span>
      <div class="nav-badge" id="dm-badge">0</div>
    </a>
  </nav>
  <div class="user-chip" onclick="openProfileModal()">
    <div class="av av-40" id="sidebar-av" style="background:#444">?</div>
    <div class="user-info">
      <div id="sidebar-name" style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;">名前未設定</div>
      <div id="sidebar-handle" style="font-size:11px;color:var(--text2);">クリックして設定</div>
    </div>
  </div>
</aside>

<!-- ═══ MAIN ═══ -->
<main class="main" id="main-col">

  <!-- ── Feed ── -->
  <div class="view active" id="view-feed">
    <div class="feed-header" style="padding:0;">
      <div style="padding:12px 16px;width:100%;display:flex;align-items:center;">
        <span style="font-size:17px;font-weight:700;">ホーム</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-latest" onclick="switchTab('latest')">最新</div>
      <div class="tab" id="tab-rec" onclick="switchTab('recommend')">おすすめ</div>
    </div>
    <div class="name-banner" id="name-banner">
      <p>👋 ユーザー名を設定してツイートしよう</p>
      <input class="txt-sm" id="name-banner-input" placeholder="表示名…" maxlength="20" style="width:120px;" onkeydown="if(event.key==='Enter')saveBanner()">
      <button class="set-btn" onclick="saveBanner()">設定する</button>
    </div>
    <div class="compose-box" id="compose-box" style="display:none;">
      <div class="av av-44" id="compose-av" style="background:#444">?</div>
      <div class="compose-right">
        <textarea class="compose-ta" id="compose-input" placeholder="いまどうしてる？" maxlength="280" rows="3" oninput="onCompose()"></textarea>
        <div class="img-pw" id="img-pw"></div>
        <div class="quote-preview" id="quote-preview" style="display:none;">
          <div class="quote-preview-author" id="qp-author"></div>
          <div id="qp-body" style="font-size:13px;color:var(--text2);"></div>
          <button class="quote-remove" onclick="cancelQuote()">✕</button>
        </div>
        <div class="poll-compose" id="poll-compose" style="display:none;">
          <div class="poll-compose-title">投票オプション</div>
          <div id="poll-options-wrap">
            <div class="poll-option-input"><input placeholder="選択肢 1" maxlength="40"><button onclick="removePollOpt(this)" style="display:none;">✕</button></div>
            <div class="poll-option-input"><input placeholder="選択肢 2" maxlength="40"><button onclick="removePollOpt(this)">✕</button></div>
          </div>
          <button class="add-poll-opt" onclick="addPollOpt()">+ 選択肢を追加</button>
        </div>
        <div class="up-status" id="up-status"></div>
        <div class="compose-toolbar">
          <div class="compose-tools">
            <button class="icon-btn" onclick="document.getElementById('img-file').click()" title="画像">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </button>
            <input type="file" id="img-file" accept="image/*" multiple style="display:none" onchange="onImgSelect(event)">
            <button class="icon-btn" id="poll-toggle-btn" onclick="togglePollCompose()" title="投票">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="4" height="18" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg>
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="char-count" id="char-count">280</span>
            <button class="post-btn" id="post-btn" onclick="postTweet()" disabled>投稿</button>
          </div>
        </div>
      </div>
    </div>
    <div id="feed"></div>
  </div>

  <!-- ── Thread ── -->
  <div class="view" id="view-thread">
    <div class="feed-header">
      <button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
      <span class="feed-header-title">ポスト</span>
    </div>
    <div id="thread-content"></div>
  </div>

  <!-- ── User page ── -->
  <div class="view" id="view-user">
    <div class="feed-header">
      <button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
      <div>
        <div id="up-name" style="font-size:16px;font-weight:700;"></div>
        <div id="up-count" style="font-size:11px;color:var(--text2);"></div>
      </div>
    </div>
    <div class="user-cover" id="user-cover"></div>
    <div class="user-profile-header">
      <div class="user-edit-bar" id="user-edit-bar"></div>
      <div class="user-av-wrap"><div class="av av-80" id="up-av" style="background:#444">?</div></div>
      <div style="font-size:19px;font-weight:700;" id="up-display-name"></div>
      <div style="font-size:14px;color:var(--text2);" id="up-handle"></div>
      <div class="user-bio" id="up-bio"></div>
      <div style="display:flex;gap:16px;margin-top:8px;">
        <div style="font-size:13px;color:var(--text2);"><strong id="up-tweet-count" style="color:var(--text);">0</strong> ポスト</div>
      </div>
      <div class="profile-tabs tabs">
        <div class="tab active" style="text-align:left;padding-left:0;">ポスト</div>
      </div>
    </div>
    <div id="user-page-feed"></div>
  </div>

  <!-- ── Users (search) ── -->
  <div class="view" id="view-members">
    <div class="feed-header">
      <button class="back-btn" onclick="goFeed()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
      <span class="feed-header-title">ユーザーを探す</span>
    </div>
    <div class="user-search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="member-search-input" placeholder="名前や@ハンドルで検索…" oninput="renderMembersView()" autocomplete="off">
    </div>
    <div id="members-view-list"></div>
  </div>

  <!-- ── DM list ── -->
  <div class="view" id="view-dm-list">
    <div class="feed-header">
      <button class="back-btn" onclick="goFeed()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
      <span class="feed-header-title">メッセージ</span>
    </div>
    <button class="dm-new-btn" onclick="openNewDmModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      新しいメッセージ
    </button>
    <div id="dm-list-content"></div>
  </div>

  <!-- ── DM chat ── -->
  <div class="view" id="view-dm-chat">
    <div class="feed-header">
      <button class="back-btn" onclick="goView('dm-list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
      <div class="av av-32" id="dm-chat-av" style="background:#444">?</div>
      <div><div id="dm-chat-name" style="font-size:14px;font-weight:700;"></div><div id="dm-chat-handle" style="font-size:11px;color:var(--text2);"></div></div>
    </div>
    <div id="dm-new-msg-bar" onclick="dismissDmNewBar()" style="display:none;background:var(--accent);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;">▼ 新着メッセージがあります</div>
    <div class="dm-chat-wrap">
      <div class="dm-messages" id="dm-messages"></div>
      <div class="dm-input-row">
        <textarea class="dm-ta" id="dm-input" placeholder="メッセージを入力…" rows="1" onkeydown="onDmKey(event)" oninput="onDmInput()"></textarea>
        <button class="dm-send-btn" id="dm-send-btn" onclick="sendDm()" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

</main>

<!-- ═══ RIGHT SIDEBAR ═══ -->
<aside class="right-sidebar">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="SicoXを検索" id="search-input" oninput="onSearch()">
  </div>
  <div class="widget"><div class="widget-title">メンバー</div><div id="members-list"></div></div>
</aside>
</div>

<!-- ═══ MOBILE NAV ═══ -->
<div class="mobile-nav">
  <button id="mob-home-btn" onclick="goFeed()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9v13h7v-7h6v7h7V9z"/></svg></button>
  <button id="mob-search-btn" onclick="goView('members')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
  <button id="mob-dm-btn" onclick="goView('dm-list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <div class="mob-badge" id="mob-dm-badge"></div>
  </button>
  <button onclick="openProfileModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
</div>

<!-- ═══ MODALS ═══ -->

<!-- Profile modal -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('profile-modal')">✕</button>
    <div style="text-align:center;margin-bottom:14px;">
      <div style="margin-bottom:6px;"><img src="https://raw.githubusercontent.com/eekunmaras/sicoX/main/logo.png" alt="SicoX" style="height:36px;width:auto;"></div>
      <div class="modal-title" style="font-size:18px;margin-bottom:0;">プロフィール設定</div>
    </div>
    <!-- Cover edit -->
    <div class="field-label">カバー画像</div>
    <div class="cover-edit-wrap" id="cover-edit-wrap" onclick="document.getElementById('cover-file').click()">
      <div class="user-cover-placeholder" id="cover-preview-inner"></div>
      <div class="cover-edit-overlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>カバーを変更</div>
    </div>
    <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="onCoverSelect(event)">
    <!-- Avatar edit -->
    <div class="av-edit-wrap">

function goView(id){

  viewStack.push(id);
  _activate(id);
}
function goFeed(){
  viewStack=['feed'];

}
function goBack(){
  if(viewStack.length>1) viewStack.pop();
  _activate(viewStack[viewStack.length-1]);
}
function _activate(id){

async function dbFetchMessages(myHandle,partnerHandle){

    .select('*')
    .or(`and(from_handle.eq.${myHandle},to_handle.eq.${partnerHandle}),and(from_handle.eq.${partnerHandle},to_handle.eq.${myHandle})`)

// DM一覧用：自分が関与する全スレッドを取得してdmStoreを更新
async function dbFetchAllThreads(myHandle){
  const {data}=await sb.from('messages')
    .select('*')
    .or(`from_handle.eq.${myHandle},to_handle.eq.${myHandle}`)
    .order('created_at',{ascending:true});
  if(!data)return;
  // dmStoreを再構築
  dmStore={};
  data.forEach(m=>{
    const key=dmKey(m.from_handle,m.to_handle);
    if(!dmStore[key])dmStore[key]=[];
    dmStore[key].push({from:m.from_handle,to:m.to_handle,text:m.text,ts:new Date(m.created_at).getTime(),read:m.read});
  });
}

// DB行→内部ツイートオブジェクト変換
function dbRowToTweet(row){
  return{
    id:row.id,
    user:{handle:row.user_handle,name:row.user_name,color:row.user_color,
          avatarUrl:row.user_avatar_url,bio:'',coverUrl:null},

    imageUrl:(row.image_urls&&row.image_urls[0])||null,
    imageUrls:row.image_urls||[],
    ts:new Date(row.created_at).getTime(),
    likes:row.likes||0,
    replyTo:row.reply_to||null,
    quoteOf:row.quote_of||null,
    isRepost:row.is_repost||false,
    repostBy:row.repost_by_handle?{handle:row.repost_by_handle,name:row.repost_by_name}:null,
    poll:row.poll?JSON.parse(row.poll):null,
    originalUser:null
  };
}

function dbRowToUser(row){
  return{handle:row.handle,name:row.name,bio:row.bio||'',
    color:row.color,avatarUrl:row.avatar_url,coverUrl:row.cover_url};
}

// リアルタイム購読
function startRealtime(){
  if(sbChannel) sb.removeChannel(sbChannel);
  sbChannel=sb.channel('app-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'tweets'},payload=>{
      const t=dbRowToTweet(payload.new);
      // 自分の投稿は既にローカルにある
      if(currentUser&&t.user.handle===currentUser.handle) return;
      // 重複チェック
      if(tweets.some(x=>x.id===t.id)) return;
      tweets.unshift(t);
      // 返信の場合はバナーを出さず、スレッドが開いていれば自動更新
      if(t.replyTo){
        const threadView=document.getElementById('view-thread');
        if(threadView&&threadView.classList.contains('active')){
          const parentEl=document.querySelector('#thread-content .thread-parent');
          if(parentEl){
            // 現在表示中のスレッドへの返信か確認
            const replyListHeader=document.querySelector('#thread-content [style*="返信"]');
            showThread(t.replyTo);
          }
        }
      } else {
        pendingNewTweets.push(1);
        _showNewBar();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'tweets'},payload=>{
      const idx=tweets.findIndex(x=>x.id===payload.new.id);
      if(idx>=0) tweets[idx]=dbRowToTweet(payload.new);
      renderFeed(document.getElementById('search-input').value.toLowerCase());
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'tweets'},payload=>{
      tweets=tweets.filter(x=>x.id!==payload.old.id);
      renderFeed(document.getElementById('search-input').value.toLowerCase());
    })
    // ── DM リアルタイム受信 ──
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
      const m=payload.new;
      if(!currentUser) return;
      // 自分が送信したメッセージは _appendDmBubble で既に表示済み
      if(m.from_handle===currentUser.handle) return;
      // 自分宛でなければ無視
      if(m.to_handle!==currentUser.handle) return;

      const msg={from:m.from_handle,to:m.to_handle,text:m.text,
                 ts:new Date(m.created_at).getTime(),read:false};

      // dmStore に追加
      const key=dmKey(m.from_handle,m.to_handle);
      if(!dmStore[key]) dmStore[key]=[];
      dmStore[key].push(msg);

      // チャット画面が開いていて相手が一致する場合 → バブル即時追加
      const chatOpen=document.getElementById('view-dm-chat').classList.contains('active');
      if(chatOpen && activeDmPartner===m.from_handle){
        _appendDmBubble(msg);
        // チャット開いているので即既読
        msg.read=true;
        dbMarkMessagesRead(currentUser.handle,m.from_handle);
      } else {
        // それ以外はバッジ更新 & トースト通知
        updateDmBadge();
        const sender=members[m.from_handle]||{name:m.from_handle};
        showToast('💬 '+sender.name+'：'+m.text.slice(0,24)+(m.text.length>24?'…':''));
      }
      // DM一覧が開いていれば再レンダリング
      if(document.getElementById('view-dm-list').classList.contains('active')) renderDmList();
    })
    .subscribe();
}

function tweetScore(t){
  const r=tweets.filter(x=>x.replyTo===t.id).length;

  return(t.likes*2+r*3)/Math.pow(age+1,.8);
}

// ══════════════════════════════════════
// URL / embed detection (②)
// ══════════════════════════════════════
const URL_RE=/https?:\/\/[^\s]+/g;
const YT_RE=/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/;
const TWITTER_RE=/(?:twitter\.com|x\.com)\/\w+\/status\/(\d+)/;

function extractUrls(text){ return text.match(URL_RE)||[]; }

function ytThumb(url){
  const m=url.match(YT_RE); if(!m)return null;
  return{type:'youtube',id:m[1],thumb:`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`,url};
}

function linkPreviewHTML(text){
  const urls=extractUrls(text); if(!urls.length)return'';
  for(const url of urls){
    const yt=ytThumb(url);
    if(yt)return`<div class="link-preview" onclick="window.open('${esc(yt.url)}','_blank');event.stopPropagation();">
      <img class="link-preview-thumb" src="${yt.thumb}" alt="YouTube" loading="lazy">
      <div class="link-preview-body"><div class="link-preview-domain">youtube.com</div><div class="link-preview-title">YouTube 動画</div></div>
    </div>`;
    // Generic link card
    return`<div class="link-preview" onclick="window.open('${esc(url)}','_blank');event.stopPropagation();">
      <div class="link-preview-body"><div class="link-preview-domain">${esc(new URL(url).hostname)}</div><div class="link-preview-title">${esc(url.length>60?url.slice(0,60)+'…':url)}</div></div>
    </div>`;
  }
  return'';
}

function bodyWithLinks(text){
  return esc(text).replace(URL_RE, url=>`<a href="${esc(url)}" target="_blank" onclick="event.stopPropagation();" style="color:var(--accent);text-decoration:none;">${esc(url)}</a>`);
}

// ══════════════════════════════════════
// Poll rendering
// ══════════════════════════════════════
function pollHTML(poll,tweetId){
  if(!poll)return'';
  const myVotedIndex=pollVotedMap[tweetId]!==undefined?pollVotedMap[tweetId]:null;
  const voted=myVotedIndex!==null;
  const winner=poll.options.indexOf(poll.options.reduce((a,b)=>a.votes>b.votes?a:b));
  const optionsHTML=poll.options.map((o,i)=>{
    const pct=poll.totalVotes?Math.round(o.votes/poll.totalVotes*100):0;
    const isW=voted&&i===winner;
    const cls='poll-option'+(voted?' voted':'')+(isW?' poll-winner':'');
    const onclick=voted?'':'votePoll(\''+tweetId+'\','+i+')';
    const bar=voted?'<div class="poll-bar" style="width:'+pct+'%"></div>':'';
    const pctSpan=voted?'<span class="poll-pct">'+pct+'%</span>':'';
    const check=myVotedIndex===i?' ✓':'';
    return'<div class="'+cls+'" onclick="'+onclick+'">'+bar+'<div class="poll-option-inner"><span>'+esc(o.text)+check+'</span>'+pctSpan+'</div></div>';
  }).join('');
  return'<div class="poll" onclick="event.stopPropagation();">'+optionsHTML+'<div class="poll-meta">'+poll.totalVotes+'票'+(voted?' · 投票済み':'')+'</div></div>';
}

function votePoll(tweetId,optIndex){
  const t=tweets.find(x=>x.id===tweetId); if(!t||!t.poll)return;
  // 自分がすでに投票済みなら無視
  if(pollVotedMap[tweetId]!==undefined) return;
  t.poll.options[optIndex].votes++;
  t.poll.totalVotes++;
  // 投票済みをlocalStorageに保存（DBのvotedIndexは書き換えない）
  pollVotedMap[tweetId]=optIndex;
  localStorage.setItem('mn_poll_voted',JSON.stringify(pollVotedMap));
  refreshCard(tweetId);
  // DB保存（票数のみ更新。votedIndexはnullのまま）
  const pollForDB={...t.poll, votedIndex:null};
  dbUpdatePoll(tweetId,pollForDB);
}
async function dbUpdatePoll(tweetId,poll){
  await sb.from('tweets').update({poll:JSON.stringify(poll)}).eq('id',tweetId);
}

  const already=repostedSet.has(tweetId);

function doRepost(){
  closeModal('repost-modal');
  if(!repostTargetId)return;
  const orig=tweets.find(x=>x.id===repostTargetId); if(!orig)return;
  if(repostedSet.has(repostTargetId)){
    // Undo repost
    repostedSet.delete(repostTargetId);
    const idx=tweets.findIndex(t=>t.isRepost&&t.quoteOf===repostTargetId&&t.user.handle===currentUser.handle&&!t.text);
    if(idx>-1){
      const removed=tweets.splice(idx,1)[0];
      dbDeleteTweet(removed.id); // DB削除
    }
    saveReposted();
    renderFeed(document.getElementById('search-input').value.toLowerCase());
    showToast('リポストを取り消しました');
    return;
  }
  repostedSet.add(repostTargetId);
  saveReposted();
  // Create repost tweet
  const rt={
    id:uid(),user:{...currentUser},text:'',
    imageUrl:null,imageUrls:[],ts:Date.now(),likes:orig.likes,
    replyTo:null,quoteOf:repostTargetId,
    isRepost:true,repostBy:{...currentUser},
    originalUser:{...orig.user},
    poll:orig.poll?JSON.parse(JSON.stringify(orig.poll)):null
  };
  tweets.unshift(rt);
  renderFeed(document.getElementById('search-input').value.toLowerCase());
  showToast('リポストしました！');
  dbPostTweet(rt); // DB保存
}

  const toAdd=files.slice(0,remaining);

  const st=document.getElementById('up-status');st.style.display='block';st.textContent='📤 アップロード中…';
  for(const file of toAdd){
    const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(file);});

  e.target.value='';
}

  selectedImages=[];
  renderImgPreview();
  document.getElementById('up-status').style.display='none';
  document.getElementById('img-file').value='';
}

function buildPollData(){
  if(!pollActive)return null;
  const inputs=[...document.querySelectorAll('#poll-options-wrap input')].map(i=>i.value.trim()).filter(Boolean);
  if(inputs.length<2)return null;
  return{options:inputs.map(t=>({text:t,votes:0})),totalVotes:0,votedIndex:null};
}

function postTweet(){
  if(!currentUser){openProfileModal();return;}
  const text=document.getElementById('compose-input').value.trim();
  if(!text&&selectedImages.length===0)return;
  const poll=buildPollData();
  const imageUrls=selectedImages.map(img=>img.uploadedUrl||img.dataUrl);
  const t={id:'t'+Date.now()+Math.random().toString(36).slice(2,6),
    user:{...currentUser},text,imageUrls,imageUrl:imageUrls[0]||null,
    ts:Date.now(),likes:0,replyTo:null,quoteOf:quoteTargetId||null,
    isRepost:false,repostBy:null,poll};
  tweets.unshift(t);
  document.getElementById('compose-input').value='';
  document.getElementById('char-count').textContent='280';
  removeAllImgs();cancelQuote();
  if(pollActive){togglePollCompose();document.getElementById('poll-options-wrap').innerHTML=`<div class="poll-option-input"><input placeholder="選択肢 1" maxlength="40"><button onclick="removePollOpt(this)" style="display:none">✕</button></div><div class="poll-option-input"><input placeholder="選択肢 2" maxlength="40"><button onclick="removePollOpt(this)">✕</button></div>`;}
  document.getElementById('post-btn').disabled=true;
  renderFeed(document.getElementById('search-input').value.toLowerCase());
  showToast('ポストしました！');
  dbPostTweet(t); // DB保存（非同期・バックグラウンド）
}

async function uploadToImgur(file){
  const fd=new FormData();fd.append('image',file);
  const res=await fetch('https://api.imgur.com/3/image',{method:'POST',headers:{'Authorization':'Client-ID '+IMGUR_CID},body:fd});
  const j=await res.json();if(!j.success)throw new Error('fail');return j.data.link;
}

function unreadCount(){
  if(!currentUser)return 0;
  let n=0;
  Object.entries(dmStore).forEach(([key,msgs])=>{
    if(key.split(':').includes(currentUser.handle))msgs.forEach(m=>{if(m.to===currentUser.handle&&!m.read)n++;});
  });
  return n;
}
function updateDmBadge(){
  const n=unreadCount();
  const b=document.getElementById('dm-badge'),mb=document.getElementById('mob-dm-badge');
  if(n>0){b.style.display='flex';b.textContent=n;mb.style.display='flex';mb.textContent=n;}
  else{b.style.display='none';mb.style.display='none';}
}
async function dmUser(handle){
  if(!currentUser){openProfileModal();return;}
  if(handle===currentUser.handle){showToast('自分自身にはDMできません');return;}
  activeDmPartner=handle;
  const partner=members[handle]||{name:handle,handle,color:userColor(handle),avatarUrl:null};
  const chav=document.getElementById('dm-chat-av');
  chav.style.background=partner.color||'#444';
  chav.innerHTML=partner.avatarUrl?`<img src="${esc(partner.avatarUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;">`:`${esc(initials(partner.name))}`;
  document.getElementById('dm-chat-name').textContent=partner.name||handle;
  document.getElementById('dm-chat-handle').textContent='@'+handle;
  // 新着バナーをリセット
  const bar=document.getElementById('dm-new-msg-bar');
  if(bar) bar.style.display='none';
  await renderDmMessages(handle);
  goView('dm-chat');
  // dm-messagesのスクロールイベントでバナー自動非表示
  const msgs=document.getElementById('dm-messages');
  msgs.onscroll=()=>{
    const atBottom=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<20;
    if(atBottom&&bar) bar.style.display='none';
  };
}
async function renderDmMessages(handle){
  const el=document.getElementById('dm-messages');
  el.innerHTML='<div class="empty-msg" style="padding:24px 0;">読込中…</div>';
  const msgs=await dbFetchMessages(currentUser.handle,handle);
  // ローカルキャッシュにも保存
  const key=dmKey(currentUser.handle,handle);
  dmStore[key]=msgs.map(m=>({from:m.from_handle,to:m.to_handle,text:m.text,ts:new Date(m.created_at).getTime(),read:m.read}));
  el.innerHTML=msgs.length?msgs.map(m=>{const mine=m.from_handle===currentUser.handle;return`<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'};"><div class="dm-bubble ${mine?'mine':'theirs'}">${esc(m.text)}<div class="dm-btime">${timeAgo(new Date(m.created_at).getTime())}</div></div></div>`;}).join(''):`<div class="empty-msg" style="padding:24px 0;">メッセージはまだありません</div>`;
  el.scrollTop=el.scrollHeight;
  // 既読処理：相手からの未読メッセージをすべて既読に
  const hasUnread=dmStore[key].some(m=>m.to===currentUser.handle&&!m.read);
  if(hasUnread){
    dmStore[key].forEach(m=>{if(m.to===currentUser.handle)m.read=true;});
    updateDmBadge();
    dbMarkMessagesRead(currentUser.handle,handle); // DB更新（非同期・バックグラウンド）
  }
}
function onDmInput(){document.getElementById('dm-send-btn').disabled=!document.getElementById('dm-input').value.trim();}
function onDmKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDm();}}
async function sendDm(){
  if(!currentUser||!activeDmPartner)return;
  const ta=document.getElementById('dm-input');
  const text=ta.value.trim();if(!text)return;
  ta.value='';document.getElementById('dm-send-btn').disabled=true;
  // ローカルに即時反映
  const key=dmKey(currentUser.handle,activeDmPartner);
  if(!dmStore[key])dmStore[key]=[];
  const msg={from:currentUser.handle,to:activeDmPartner,text,ts:Date.now(),read:false};
  dmStore[key].push(msg);
  // UIに即時追加（DBフェッチなし）
  _appendDmBubble(msg);
  // DBに保存
  await dbSendMessage(currentUser.handle,activeDmPartner,text);
}
function _appendDmBubble(msg){
  const el=document.getElementById('dm-messages');
  // 「メッセージはまだありません」などの空メッセージを消す
  const empty=el.querySelector('.empty-msg');
  if(empty)empty.remove();
  const mine=msg.from===currentUser.handle;
  const div=document.createElement('div');
  div.style.cssText=`display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'};`;
  div.innerHTML=`<div class="dm-bubble ${mine?'mine':'theirs'}">${esc(msg.text)}<div class="dm-btime">${timeAgo(msg.ts)}</div></div>`;
  el.appendChild(div);
  if(mine){
    // 自分の送信 → 常に最下部へ
    el.scrollTop=el.scrollHeight;
  } else {
    // 相手からの新着 → バナーを表示して最下部へスクロール
    const bar=document.getElementById('dm-new-msg-bar');
    if(bar){ bar.style.display='block'; }
    // 少し遅延させて要素が追加された後にスクロール
    setTimeout(()=>{ el.scrollTop=el.scrollHeight; }, 50);
  }
}

  const bar=document.getElementById('dm-new-msg-bar');
  if(bar) bar.style.display='none';
  const el=document.getElementById('dm-messages');

function renderDmList(){
  if(!currentUser){document.getElementById('dm-list-content').innerHTML=`<div class="empty-msg">名前を設定するとDMを使えます</div>`;return;}
  const myH=currentUser.handle;

  }).join(''):`<div class="empty-msg">メッセージはまだありません<br>上のボタンから送ってみましょう</div>`;

  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

// ══════════════════════════════════════
// Lightbox
// ══════════════════════════════════════
let lbUrls=[],lbIdx=0;
function openLightbox(urls,idx){
  lbUrls=Array.isArray(urls)?urls:[urls];
  lbIdx=idx;
  _lbRender();
  document.getElementById('lightbox').classList.add('open');
  document.body.classList.add('modal-open');
}
function _lbRender(){
  document.getElementById('lb-img').src=lbUrls[lbIdx];
  const multi=lbUrls.length>1;
  document.getElementById('lb-prev').style.display=multi?'flex':'none';
  document.getElementById('lb-next').style.display=multi?'flex':'none';
  document.getElementById('lb-counter').textContent=multi?`${lbIdx+1} / ${lbUrls.length}`:'';
}
function lbMove(dir){
  lbIdx=(lbIdx+dir+lbUrls.length)%lbUrls.length;
  _lbRender();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.classList.remove('modal-open');
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')lbMove(-1);
  if(e.key==='ArrowRight')lbMove(1);
});

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
async function appStart(){
  // バー更新
  document.getElementById('demo-bar-label').textContent='接続中…';
  document.getElementById('demo-bar-msg').textContent='';

  try {
    // ユーザー・プロフィールロード
    loadUserLS();
    if(currentUser){ applyUser(); members[currentUser.handle]={...currentUser}; await dbSaveProfile(currentUser); }

    // メンバー一覧取得
    await fetchMembers();
    renderMembers();

    // 初回シード（空DBのみ）
    await seed();

    // ツイート取得
    await fetchTweets();

    // リアルタイム購読開始
    startRealtime();

    // バー更新（ライブモード）
    document.getElementById('demo-bar-label').textContent='ライブ';
    document.getElementById('demo-bar-msg').textContent='— 投稿はリアルタイムで全員に反映されます';

  } catch(e) {
    console.error(e);
    document.getElementById('demo-bar-label').textContent='オフライン';
    document.getElementById('demo-bar-msg').textContent='— DB接続失敗。ローカルモードで動作中';
    // フォールバック：ローカルで動かす
    seed_local();
    renderFeed();
    renderMembers();
  }

  startNewPostSim();
  // スマホキーボード表示時のDMチャット位置補正
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      const chatView=document.getElementById('view-dm-chat');
      if(!chatView.classList.contains('active')) return;
      // キーボードが出た分、dm-chatの高さを調整
      const vvH=window.visualViewport.height;
      const offsetTop=window.visualViewport.offsetTop||0;
      chatView.style.top=offsetTop+'px';
      chatView.style.height=vvH+'px';
      // 最新メッセージにスクロール
      const msgs=document.getElementById('dm-messages');
      setTimeout(()=>{ msgs.scrollTop=msgs.scrollHeight; },50);
    });
  }
}
