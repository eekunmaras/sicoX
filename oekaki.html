<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─────────────────────────────────────────────
   親(sicoX本体)との通信ブリッジ
   ポイント残高・タイル一覧・伝言一覧はすべて親(Supabase)が真実の値を持つ。
   このページはpostMessageで依頼を送り、結果を待つだけ。
   ───────────────────────────────────────────── */
const EMBEDDED = window.parent && window.parent !== window;
const PENDING = new Map();
function bridge(type, payload = {}, timeout = 8000) {
  if (!EMBEDDED) return Promise.resolve({ ok: false, error: 'sicoX内から起動してください' });
  const reqId = 'oe' + Date.now() + Math.random().toString(36).slice(2, 8);
  return new Promise((resolve) => {
    const timer = setTimeout(() => { PENDING.delete(reqId); resolve({ ok: false, error: '通信がタイムアウトしました' }); }, timeout);
    PENDING.set(reqId, { resolve, timer });
    window.parent.postMessage(Object.assign({ type, reqId }, payload), '*');
  });
}
window.addEventListener('message', (e) => {
  const msg = e.data || {};
  if (msg.type === 'oekaki:response' && PENDING.has(msg.reqId)) {
    const req = PENDING.get(msg.reqId);
    clearTimeout(req.timer);
    PENDING.delete(msg.reqId);
    req.resolve(msg);
  }
});

/* ─────────────────────────────────────────────
   お題生成
   ・かんたん/ふつう/むずかしい は、本体SNSがすでに持っている
     /groq-proxy（@grok Botと同じCloudflare Pages Function）を
     そのまま流用して Groq が生成する（同一オリジンなので相対パスでOK）
   ・バッチでまとめて取得しプールに貯め、クリックのたびには呼ばない
   ・超絶オニムズ（出現率1%）は当たりを固定で保証したいのでローカル固定
   ・/groq-proxy に繋がらない時は FALLBACK_TOPICS でゲームを止めない
   ───────────────────────────────────────────── */
const GROQ_PROXY_URL = '/groq-proxy'; // 本体と同じエンドポイント。oekaki.htmlが別ドメインで動く場合はフルURLに変更
const OEKAKI_GROQ_MODEL = 'llama-3.3-70b-versatile'; // @grok Botと同じモデル。このproxy経由で動作確認済みのため合わせている

const EXTREME_TOPICS = [
  { text: 'えんとつからおちそうなサンタ', answers: ['えんとつからおちそうなさんた', 'サンタがえんとつからおちる', 'えんとつでつまったさんた'] },
  { text: 'じかくのないうちゅうひこうし', answers: ['じかくのないうちゅうひこうし', 'まいごのうちゅうひこうし'] },
  { text: 'かいてんずしのれーんでねているねこ', answers: ['かいてんずしのれーんでねているねこ', 'すしやのれーんでねむるねこ'] },
];
// 手作りの安全なお題バンク（すべて実在する自然な日本語・ひらがなのみで検証済み）。
// AIに頼りすぎず、ここが枯れることがないよう十分な数を用意しておく。
const FALLBACK_TOPICS = {
  easy: [
    { text: 'りんご', answers: ['りんご'] },
    { text: 'ねこ', answers: ['ねこ'] },
    { text: 'いぬ', answers: ['いぬ'] },
    { text: 'にじ', answers: ['にじ'] },
    { text: 'かさ', answers: ['かさ'] },
    { text: 'つき', answers: ['つき'] },
    { text: 'ほし', answers: ['ほし'] },
    { text: 'はな', answers: ['はな'] },
    { text: 'やま', answers: ['やま'] },
    { text: 'くも', answers: ['くも'] },
    { text: 'ゆき', answers: ['ゆき'] },
    { text: 'ほん', answers: ['ほん'] },
    { text: 'めがね', answers: ['めがね'] },
    { text: 'ぼうし', answers: ['ぼうし'] },
    { text: 'くつ', answers: ['くつ'] },
    { text: 'たまご', answers: ['たまご'] },
    { text: 'おにぎり', answers: ['おにぎり'] },
    { text: 'じてんしゃ', answers: ['じてんしゃ'] },
  ],
  normal: [
    { text: 'かさをさすひと', answers: ['かさをさすひと', 'かさをさしているひと', 'あめのひのひと'] },
    { text: 'ねているねこ', answers: ['ねているねこ', 'ねこがねている', 'すいみんちゅうのねこ'] },
    { text: 'わらっているこども', answers: ['わらっているこども', 'こどもがわらっている'] },
    { text: 'はしっているいぬ', answers: ['はしっているいぬ', 'いぬがはしっている'] },
    { text: 'およいでいるさかな', answers: ['およいでいるさかな', 'さかながおよいでいる'] },
    { text: 'とんでいるとり', answers: ['とんでいるとり', 'とりがとんでいる'] },
    { text: 'ふりつもるゆき', answers: ['ふりつもるゆき', 'つもったゆき', 'ゆきがふりつもる'] },
    { text: 'われたたまご', answers: ['われたたまご', 'たまごがわれた'] },
    { text: 'さいているはな', answers: ['さいているはな', 'はながさいている'] },
    { text: 'まるいつき', answers: ['まるいつき', 'まんまるのつき'] },
    { text: 'おおきいぞう', answers: ['おおきいぞう'] },
    { text: 'ちいさいあり', answers: ['ちいさいあり'] },
    { text: 'あかいりんご', answers: ['あかいりんご'] },
    { text: 'あおいそら', answers: ['あおいそら'] },
    { text: 'しろいくも', answers: ['しろいくも'] },
    { text: 'ながいへび', answers: ['ながいへび'] },
    { text: 'たかいやま', answers: ['たかいやま'] },
    { text: 'まるいボール', answers: ['まるいぼーる', 'まるいまり'] },
  ],
  hard: [
    { text: 'てんめつするらいと', answers: ['てんめつするらいと', 'らいとがてんめつする', 'てんめつしているらいと', 'ぴかぴかするらいと'] },
    { text: 'おばけやしき', answers: ['おばけやしき', 'おばけのいえ', 'おばけがでるいえ'] },
    { text: 'とけいがとまったへや', answers: ['とけいがとまったへや', 'じかんがとまったへや'] },
    { text: 'ゆきだるまをつくるこども', answers: ['ゆきだるまをつくるこども', 'こどもがゆきだるまをつくる'] },
    { text: 'たこあげをするおやこ', answers: ['たこあげをするおやこ', 'おやことたこあげ'] },
    { text: 'つりをするひと', answers: ['つりをするひと', 'さかなをつるひと'] },
    { text: 'なわとびをするこども', answers: ['なわとびをするこども', 'こどもがなわとびをする'] },
    { text: 'はなびをみるひとたち', answers: ['はなびをみるひとたち', 'はなびたいかい'] },
    { text: 'やまのぼりをするひと', answers: ['やまのぼりをするひと', 'とざんをするひと'] },
    { text: 'りょうりをするひと', answers: ['りょうりをするひと', 'りょうりちゅうのひと'] },
    { text: 'せんたくものをほすひと', answers: ['せんたくものをほすひと', 'せんたくをほすひと'] },
    { text: 'じてんしゃにのるひと', answers: ['じてんしゃにのるひと', 'じてんしゃをこぐひと'] },
    { text: 'いぬのさんぽをするひと', answers: ['いぬのさんぽをするひと', 'いぬとさんぽするひと'] },
    { text: 'ほんをよむこども', answers: ['ほんをよむこども', 'こどもがほんをよんでいる'] },
    { text: 'えをかくひと', answers: ['えをかくひと', 'えをかいているひと'] },
  ],
};
const POINTS_BY_DIFFICULTY = { easy: 100000, normal: 500000, hard: 1000000, extreme: 10000000 };
const DIFF_LABEL = { easy: 'かんたん', normal: 'ふつう', hard: 'むずかしい', extreme: '超絶オニムズ' };
const DIFF_CLASS = { easy: 'diff-easy', normal: 'diff-normal', hard: 'diff-hard', extreme: 'diff-extreme' };

function normalize(s) { return String(s || '').replace(/\s/g, '').trim(); }

// /groq-proxy から取得した easy/normal のお題を貯めておくプール。
// hard は動詞の活用が絡んで崩れやすい（例:「すいえいする」→誤って「すいえいる」）ため、
// AIには易しい単語・形容詞+名詞だけを任せ、hardは手作りリストに固定する。
let topicPool = [];
let refillInFlight = null;
async function refillTopicPool(n = 20) {
  if (refillInFlight) return refillInFlight; // 同時に何度も叩かないようにする
  refillInFlight = (async () => {
    try {
      const systemPrompt =
        'あなたはお絵描き当てゲームのお題作成係です。実在する具体的なもの・生き物・食べ物・場所など、誰が見ても「ああ、これのことか」とわかり、かつ絵として実際に描けるお題だけを作ってください。' +
        '出すのは easy(単語1つだけ) と normal(形容詞や状態を表す短い言葉＋名詞、2〜3語程度) の2種類だけです。動詞の活用が入る複雑な文は絶対に作らないでください。' +
        '【意味の通らないお題・存在しない言葉は絶対禁止】文字を適当に並べただけの言葉や、活用を誤った言葉（正しくない言い回し）は絶対に作らないでください。迷ったら簡単な単語1つだけにしてください。' +
        '良い例(easy): "りんご" "ねこ" "やま" "つき"。良い例(normal): "あかいりんご" "たかいやま" "まるいつき" "ふりつもるゆき" "われたたまご"。' +
        '悪い例（意味不明・存在しない言葉なので絶対に作らないこと）: "おにんぎり" "おうさまでつながる" "くじらがすいえいる" "おおぜのひとはだす"。' +
        '【最重要】text・answersに入れる文字列は、必ず「ひらがなのみ」にしてください。漢字・カタカナ・英数字・記号は1文字たりとも使わないでください（例: "テレビ"はNG、"てれび"と書くこと）。' +
        '各お題には、正解として許容すべき言い回しのバリエーション（語順違い・助詞違いなど、すべてひらがな）を3〜5個付けてください。' +
        '出力は次のJSON形式のみで、説明文やマークダウンのコードブロック記法は一切付けないでください: ' +
        '{"topics":[{"text":"あかいりんご","difficulty":"normal","answers":["あかいりんご","りんごがあかい"]}]}';

      const res = await fetch(GROQ_PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: OEKAKI_GROQ_MODEL,
          max_tokens: 1500,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: `お題を${n}個、JSON形式で作ってください。ひらがな以外は絶対に使わないでください。実在する自然な言葉だけにしてください。` },
          ],
        }),
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
      }
      const data = await res.json();
      const raw = (data.choices?.[0]?.message?.content || '{}').trim().replace(/^```json\s*|```$/g, '').replace(/```$/g, '').trim();
      const parsed = JSON.parse(raw);
      // Groqが指示を無視して漢字/カタカナを混ぜたり、不自然な言葉を作ってくることがあるので機械的に弾く
      const isPureHiragana = (s) => /^[\u3040-\u309Fー\s]*$/.test(String(s || ''));
      const valid = (Array.isArray(parsed.topics) ? parsed.topics : []).filter(
        (t) =>
          t &&
          typeof t.text === 'string' &&
          ['easy', 'normal'].includes(t.difficulty) &&
          Array.isArray(t.answers) &&
          t.answers.length > 0 &&
          isPureHiragana(t.text) &&
          t.answers.every((a) => typeof a === 'string' && isPureHiragana(a))
      );
      topicPool.push(...valid.map((t) => ({ text: t.text, difficulty: t.difficulty, answers: t.answers })));
    } catch (e) {
      console.warn('/groq-proxy 経由のお題生成に失敗、フォールバックを使います', e);
    } finally {
      refillInFlight = null;
    }
  })();
  return refillInFlight;
}
async function pickTopicAsync() {
  // 1%で超絶オニムズを確定当選させる
  if (Math.random() < 0.01) {
    const base = EXTREME_TOPICS[Math.floor(Math.random() * EXTREME_TOPICS.length)];
    return { ...base, difficulty: 'extreme' };
  }
  const tiers = ['easy', 'normal', 'hard'];
  const tier = tiers[Math.floor(Math.random() * tiers.length)];
  // hardは活用崩れを避けるため常に手作りリストから選ぶ（AIには任せない）
  if (tier === 'hard') {
    const list = FALLBACK_TOPICS.hard;
    const base = list[Math.floor(Math.random() * list.length)];
    return { ...base, difficulty: 'hard' };
  }
  if (topicPool.length < 3) await refillTopicPool(20);
  const fromPool = topicPool.find((t) => t.difficulty === tier);
  if (fromPool) {
    topicPool.splice(topicPool.indexOf(fromPool), 1);
    return fromPool;
  }
  // AIプールが空、または欲しい難易度が無かった場合は手作りリストから
  const list = FALLBACK_TOPICS[tier];
  const base = list[Math.floor(Math.random() * list.length)];
  return { ...base, difficulty: tier };
}
function formatPt(n) {
  if (!n) return '0';
  if (n >= 10000) return `${Math.round(n / 10000).toLocaleString('ja-JP')}万`;
  return n.toLocaleString('ja-JP');
}
function daysLeft(iso, span) {
  if (!iso) return span;
  const passed = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return Math.max(0, span - passed);
}

function DiffBadge({ difficulty }) {
  return <span className={`diff-badge ${DIFF_CLASS[difficulty]}`}>{DIFF_LABEL[difficulty]}</span>;
}
function GuessList({ loading, guesses, title, emptyText }) {

            </div>
          ))}
        </div>
      )}
    </div>
  );
}
function CharHint({ count, firstChar }) {
  const shown = Math.min(count || 0, 10);
  return (
    <div className="hint-row">
      <div className="hint-boxes">
        {Array.from({ length: shown }).map((_, i) =>
          i === 0 && firstChar ? (
            <span key={i} className="hint-box hint-box-filled">{firstChar}</span>
          ) : (
            <span key={i} className="hint-box" />
          )
        )}
      </div>
      <span className="hint-count">{count}もじ</span>
    </div>
  );
}

/* ── お絵かきキャンバス ── */
function DrawingCanvas({ referenceImage, promptTopic, onCancel, onSubmit }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [color, setColor] = useState('#1f2937');
  const [size, setSize] = useState(4);

  useEffect(() => {
    const ctx = canvasRef.current.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 300, 300);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }, []);

  const getPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: ((cx - rect.left) / rect.width) * 300, y: ((cy - rect.top) / rect.height) * 300 };
  };
  const start = (e) => { e.preventDefault(); drawing.current = true; const ctx = canvasRef.current.getContext('2d'); const { x, y } = getPos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = (e) => { if (!drawing.current) return; e.preventDefault(); const ctx = canvasRef.current.getContext('2d'); ctx.strokeStyle = color; ctx.lineWidth = size; const { x, y } = getPos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const end = () => { drawing.current = false; };
  const clear = () => { const ctx = canvasRef.current.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 300, 300); };

  const colors = ['#1f2937', '#ffffff', '#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899', '#78350f'];

  return (
    <div>
      {referenceImage && (
        <div className="ref-card">
          <div className="ref-label">前の人が描いた絵</div>
          <img src={referenceImage} alt="前の絵" className="ref-img" />
        </div>
      )}
      {promptTopic && (
        <div className="prompt-card">
          <div className="row-between">
            <span className="prompt-label">おだい</span>
            <DiffBadge difficulty={promptTopic.difficulty} />
          </div>
          <div className="prompt-text">{promptTopic.text}</div>
        </div>
      )}
      <canvas ref={canvasRef} width={300} height={300}
        onPointerDown={start} onPointerMove={move} onPointerUp={end} onPointerLeave={end} />
      <div className="swatches">
        {colors.map((c) => (
          <span key={c} onClick={() => setColor(c)} className={`swatch ${color === c ? 'on' : ''}`} style={{ background: c }} />
        ))}
      </div>
      <div className="tool-row">
        <div className="sizes">
          <button className={`size-btn ${size === 3 ? 'on' : ''}`} onClick={() => setSize(3)}><span className="size-dot" style={{ width: 6, height: 6 }} /></button>
          <button className={`size-btn ${size === 8 ? 'on' : ''}`} onClick={() => setSize(8)}><span className="size-dot" style={{ width: 12, height: 12 }} /></button>
        </div>
        <button className="clear-btn" onClick={clear}>消す</button>
      </div>
      <div className="row-btns">
        <button className="big-btn secondary" onClick={onCancel}>やめる</button>
        <button className="big-btn" onClick={() => onSubmit(canvasRef.current.toDataURL('image/png'))}>描き終わった</button>
      </div>
    </div>
  );
}

function TopBar({ title, onBack, points }) {
  return (

    </div>

}
function Toast({ message }) { if (!message) return null; return <div className="toast">{message}</div>; }

function makeConfetti() {
  const colors = ['#a78bfa', '#f472b6', '#fbbf24', '#34d399', '#60a5fa'];
  return Array.from({ length: 16 }, (_, i) => ({ id: i, left: Math.random() * 100, delay: Math.random() * 0.4, color: colors[i % colors.length] }));
}
function CelebrationOverlay({ data, onClose }) {
  if (!data) return null;
  return (
    <div className="overlay-bg" onClick={onClose} style={{ overflow: 'hidden' }}>
      {data.confetti.map((c) => (
        <span key={c.id} style={{ position: 'absolute', top: 0, left: `${c.left}%`, width: 10, height: 10, borderRadius: 3, background: c.color, animation: `confettiFall 1.4s ease-in ${c.delay}s both` }} />
      ))}
      <div className="overlay-card" style={{ animation: 'popIn .5s ease-out both' }}>
        <div style={{ fontSize: 30, marginBottom: 6 }}>✨</div>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 6 }}>せいかい！</div>
        <div style={{ marginBottom: 8 }}><DiffBadge difficulty={data.difficulty} /></div>
        <div style={{ fontSize: 28, fontWeight: 800, background: 'linear-gradient(90deg,#8b5cf6,#d946ef)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>+{formatPt(data.points)}pt</div>
        <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 8 }}>タップで閉じる</div>
      </div>
    </div>
  );
}

function App() {
  const [me, setMe] = useState(null);       // {handle,name,avatar}

  const [ready, setReady] = useState(false);
  const [authError, setAuthError] = useState('');
  const [view, setView] = useState('menu');
  const [toast, setToast] = useState('');
  const [celebration, setCelebration] = useState(null);

  const [tiles, setTiles] = useState([]);
  const [tilesLoading, setTilesLoading] = useState(false);
  const [activeTile, setActiveTile] = useState(null);
  const [ephemeralTopic, setEphemeralTopic] = useState(null);
  const [guessDraft, setGuessDraft] = useState('');
  const [showRevealConfirm, setShowRevealConfirm] = useState(false);
  const [tileGuesses, setTileGuesses] = useState([]);
  const [tileGuessesLoading, setTileGuessesLoading] = useState(false);
  const [busy, setBusy] = useState(false);

  const [chains, setChains] = useState([]);
  const [chainsLoading, setChainsLoading] = useState(false);
  const [activeChain, setActiveChain] = useState(null);
  const [chainTopicDraft, setChainTopicDraft] = useState(null); // 新規チェーンの初回だけローカルに保持

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };
  const triggerCelebration = (pts, difficulty) => {
    setCelebration({ points: pts, difficulty, confetti: makeConfetti() });
    setTimeout(() => setCelebration(null), 2400);
  };

  // 起動時: 自分が誰か＋所持ポイントを取得
  useEffect(() => {
    (async () => {
      const res = await bridge('oekaki:points:init:request');
      if (res.ok) {
        setMe(res.user);
        setPoints(res.balance || 0);
        setReady(true);
        refillTopicPool(20); // 先読みしておくと「描く」を押した瞬間の待ち時間が減る
      } else {
        setAuthError(res.error || 'sicoX内から起動してください');
      }
    })();
  }, []);

  const refreshTiles = useCallback(async () => {
    setTilesLoading(true);
    const res = await bridge('oekaki:tiles:list:request');
    if (res.ok) setTiles(res.tiles || []);
    setTilesLoading(false);
  }, []);
  const refreshChains = useCallback(async () => {
    setChainsLoading(true);
    const res = await bridge('oekaki:chains:list:request');
    if (res.ok) setChains(res.chains || []);
    setChainsLoading(false);
  }, []);
  const [leaderboard, setLeaderboard] = useState([]);
  const [leaderboardLoading, setLeaderboardLoading] = useState(false);
  const refreshLeaderboard = useCallback(async () => {
    setLeaderboardLoading(true);
    const res = await bridge('oekaki:leaderboard:request');
    if (res.ok) setLeaderboard(res.board || []);
    setLeaderboardLoading(false);
  }, []);

  // 一覧画面にいる間はゆるくポーリング（他の人の投稿・回答を拾う）
  useEffect(() => {
    if (!ready) return;
    if (view === 'menu') { refreshLeaderboard(); const t = setInterval(refreshLeaderboard, 20000); return () => clearInterval(t); }
    if (view === 'tiles') { refreshTiles(); const t = setInterval(refreshTiles, 12000); return () => clearInterval(t); }
    if (view === 'chains') { refreshChains(); const t = setInterval(refreshChains, 12000); return () => clearInterval(t); }
  }, [view, ready, refreshTiles, refreshChains, refreshLeaderboard]);

  const goMenu = () => { setView('menu'); setToast(''); };

  /* ── タイル ── */
  const [topicLoading, setTopicLoading] = useState(false);
  const fetchTileGuesses = (tileId) => {
    setTileGuesses([]);
    setTileGuessesLoading(true);
    bridge('oekaki:tiles:guesses:request', { tileId }).then((res) => {
      setTileGuessesLoading(false);
      if (res.ok) setTileGuesses(res.guesses || []);
    });
  };
  const openTile = async (tile) => {
    if (tile.status === 'empty_placeholder') {
      setTopicLoading(true);
      const topic = await pickTopicAsync();
      setTopicLoading(false);
      setEphemeralTopic(topic);
      setActiveTile(tile);
      setView('tileDraw');
      return;
    }
    if (tile.status === 'pending') {
      if (tile.drawer_handle === me.handle) {
        setActiveTile(tile);
        setView('tileOwn');
        fetchTileGuesses(tile.id);
      } else {
        setActiveTile(tile);
        setGuessDraft('');
        setView('tileGuess');
        fetchTileGuesses(tile.id);
      }
    }
  };
  const submitTileDrawing = async (dataUrl) => {
    setBusy(true);
    const res = await bridge('oekaki:tiles:create', {
      topic: ephemeralTopic.text, difficulty: ephemeralTopic.difficulty, answers: ephemeralTopic.answers, image: dataUrl,
    });
    setBusy(false);
    if (!res.ok) { flash(res.error || '投稿に失敗しました'); return; }
    setEphemeralTopic(null);
    setView('tiles');
    flash('絵を投稿しました');
    refreshTiles();
  };
  const submitTileGuess = async () => {
    setBusy(true);
    const res = await bridge('oekaki:tiles:guess', { tileId: activeTile.id, guessText: guessDraft });
    setBusy(false);
    if (!res.ok) { flash(res.error || '通信に失敗しました'); return; }
    if (!res.correct) {
      flash('ざんねん、もう一度');
      setTileGuesses((prev) => [...prev, { name: me.name, guess_text: guessDraft, correct: false }]);
      setGuessDraft('');
      return;
    }
    setPoints(res.balance);
    setView('tiles');
    triggerCelebration(res.points, activeTile.difficulty);
    refreshTiles();
  };
  const confirmReveal = async () => {
    setBusy(true);
    const res = await bridge('oekaki:tiles:reveal', { tileId: activeTile.id });
    setBusy(false);
    setShowRevealConfirm(false);
    if (!res.ok) { flash(res.error || '更新に失敗しました'); return; }
    flash('こたえを表示しました（ポイントの還付はありません）');
    setView('tiles');
    refreshTiles();
  };

  /* ── 伝言おえかき ── */
  const startNewChain = async () => {
    setTopicLoading(true);
    const topic = await pickTopicAsync();
    setTopicLoading(false);
    setChainTopicDraft(topic);
    setActiveChain(null);
    setView('chainDraw');
  };
  const joinChain = (chain) => {
    if (me && (chain.participants || []).includes(me.handle)) { flash('このお題にはもう参加済みです'); return; }
    setActiveChain(chain);
    setChainTopicDraft(null);
    if ((chain.steps || []).length < 4) setView('chainDraw');
    else { setGuessDraft(''); setView('chainGuess'); }
  };
  const submitChainDrawing = async (dataUrl) => {
    setBusy(true);
    if (!activeChain) {
      // 新規チェーンの1人目: 作成と同時に最初のステップも入れる
      const res = await bridge('oekaki:chains:create', {
        topic: chainTopicDraft.text, difficulty: chainTopicDraft.difficulty, answers: chainTopicDraft.answers,
        firstStep: { handle: me.handle, name: me.name, image: dataUrl },
      });
      setBusy(false);
      if (!res.ok) { flash(res.error || '作成に失敗しました'); return; }
    } else {
      const res = await bridge('oekaki:chains:draw', { chainId: activeChain.id, image: dataUrl });
      setBusy(false);
      if (!res.ok) { flash(res.error || '更新に失敗しました'); return; }
    }
    setChainTopicDraft(null);
    setActiveChain(null);
    setView('chains');
    flash('次の人にバトンタッチ');
    refreshChains();
  };
  const submitChainGuess = async () => {
    setBusy(true);
    const res = await bridge('oekaki:chains:guess', { chainId: activeChain.id, guessText: guessDraft });
    setBusy(false);
    if (!res.ok) { flash(res.error || '通信に失敗しました'); return; }

    setActiveChain(res.chain);
    setView('chainReveal');
    refreshChains();
  };
  const openFinishedChain = (chain) => { setActiveChain(chain); setView('chainReveal'); };

  if (!ready) {

      <div className="wrap">
        <TopBar title="おえかき" points={0} />

    );

            <div style={{ fontSize: 26, marginBottom: 6 }}>👁️</div>
            <div style={{ fontWeight: 800, marginBottom: 4 }}>こたえを表示しますか？</div>

        </div>

        <div>
          <TopBar title="おえかき" points={currentPoints} />
          <button className="nav-card" onClick={() => setView('tiles')}>

            <div>
              <div className="nav-title">お題当てタイル</div>
              <div className="nav-sub">好きなお題を選んで描く、または答える</div>
            </div>
          </button>
          <button className="nav-card" onClick={() => setView('chains')}>
            <div className="nav-icon chain">👥</div>

              <div className="nav-title">伝言おえかき</div>

            ) : leaderboard.length === 0 ? (

      {view === 'tileGuess' && activeTile && (
        <div>
          <TopBar title="お題を当てる" onBack={() => setView('tiles')} points={currentPoints} />
          <img src={activeTile.image} alt="回答対象の絵" style={{ width: '100%', borderRadius: 18, border: '2px solid #ddd6fe', marginBottom: 10 }} />
          <div className="row-between" style={{ marginBottom: 10 }}>
            <DiffBadge difficulty={activeTile.difficulty} />
            <CharHint count={activeTile.char_hint} firstChar={activeTile.first_char_hint} />
          </div>
          <div className="reward-banner">正解でお互いに {formatPt(POINTS_BY_DIFFICULTY[activeTile.difficulty])}pt 獲得！</div>
          <input className="input-lg" value={guessDraft} onChange={(e) => setGuessDraft(e.target.value)} placeholder="ひらがなで答えてね" />
          <button className="big-btn" onClick={submitTileGuess} disabled={busy}>✓ 回答する</button>
          <GuessList loading={tileGuessesLoading} guesses={tileGuesses} title="みんなの回答（まだ正解なし）" emptyText="まだ誰も答えていません。一番乗りになろう！" />
        </div>
      )}

      {view === 'tileOwn' && activeTile && (
        <div>
          <TopBar title="自分の絵" onBack={() => setView('tiles')} points={currentPoints} />
          <img src={activeTile.image} alt="自分が描いた絵" style={{ width: '100%', borderRadius: 18, border: '2px solid #ddd6fe', marginBottom: 10 }} />
          <div className="row-between" style={{ marginBottom: 10 }}>
            <DiffBadge difficulty={activeTile.difficulty} />
            <CharHint count={activeTile.char_hint} firstChar={activeTile.first_char_hint} />
          </div>
          <button className="big-btn secondary" onClick={() => setShowRevealConfirm(true)}>👁️ こたえを表示する</button>
          <GuessList loading={tileGuessesLoading} guesses={tileGuesses} title="みんなの回答（まだ正解なし・ヒントにどうぞ）" />
        </div>
      )}

      {view === 'chains' && (
        <div>
          <TopBar title="伝言おえかき" onBack={goMenu} points={currentPoints} />
          {chainsLoading && chains.length === 0 && <div className="center-note">読み込み中...</div>}
          {activeChains.map((chain) => {
            const joined = me && (chain.participants || []).includes(me.handle);
            const stepCount = (chain.steps || []).length;
            return (
              <div key={chain.id} className="chain-card">
                <div className="chain-dots">
                  {[0, 1, 2, 3].map((i) => <span key={i} className={`dot ${stepCount > i ? 'on' : ''}`}>{i + 1}</span>)}
                  <span className="dot">5</span>
                  <span className="dot-meta">{stepCount}/4人</span>
                </div>
                <button className={`big-btn ${joined ? 'disabled' : ''}`} onClick={() => joinChain(chain)} disabled={joined}>
                  {joined ? '🔒 参加済み' : stepCount < 4 ? '絵を描いて参加する' : '最後の絵を見て当てる'}
                </button>
              </div>
            );
          })}
          <button className="big-btn secondary" onClick={startNewChain} disabled={topicLoading} style={{ marginBottom: 16 }}>{topicLoading ? 'お題を考え中...' : '＋ 新しい伝言を始める'}</button>

          {finishedChains.length > 0 && (
            <div>
              <div className="section-label">終了した伝言・1か月で自動削除</div>
              {finishedChains.map((chain) => (
                <button key={chain.id} onClick={() => openFinishedChain(chain)} className={`archived-card ${chain.guess.correct ? 'ok' : 'ng'}`}>
                  <div className="row-between">
                    <span style={{ fontWeight: 800, color: chain.guess.correct ? '#047857' : '#be123c' }}>{chain.topic}</span>
                    <span>{chain.guess.correct ? '✓' : '✕'}</span>
                  </div>
                  <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 2 }}>あと{daysLeft(chain.finished_at, 30)}日で削除</div>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {view === 'chainDraw' && (
        <div>
          <TopBar title={`${activeChain ? (activeChain.steps || []).length + 1 : 1}人目`} onBack={() => setView('chains')} points={currentPoints} />
          <DrawingCanvas
            promptTopic={!activeChain ? chainTopicDraft : null}
            referenceImage={activeChain ? activeChain.steps[activeChain.steps.length - 1].image : null}
            onCancel={() => { setActiveChain(null); setChainTopicDraft(null); setView('chains'); }}
            onSubmit={submitChainDrawing}
          />
        </div>
      )}

      {view === 'chainGuess' && activeChain && (
        <div>
          <TopBar title="5人目：一発勝負" onBack={() => setView('chains')} points={currentPoints} />
          <img src={activeChain.steps[3].image} alt="最終的な絵" style={{ width: '100%', borderRadius: 18, border: '2px solid #ddd6fe', marginBottom: 10 }} />
          <div className="warn-banner">回答は1回だけ。外れたらこの場でおだいが発表されます</div>
          <input className="input-lg" value={guessDraft} onChange={(e) => setGuessDraft(e.target.value)} placeholder="最初のおだいは何だと思う？" />
          <button className="big-btn" onClick={submitChainGuess} disabled={busy}>✓ 回答する（一発勝負）</button>
        </div>
      )}

      {view === 'chainReveal' && activeChain && activeChain.guess && (
        <div>
          <TopBar title="結果発表" onBack={() => setView('chains')} points={currentPoints} />
          <div className="prompt-card">
            <div className="row-between">
              <span className="prompt-label">最初のおだい</span>
              <DiffBadge difficulty={activeChain.difficulty} />
            </div>
            <div className="prompt-text">{activeChain.topic}</div>
          </div>
          {(activeChain.steps || []).map((s, i) => (
            <div key={i} className="step-card">
              <div className="step-label">{i + 1}人目：{s.name}</div>
              <img src={s.image} alt={`${i + 1}人目の絵`} className="step-img" />
            </div>
          ))}
          <div className={`archived-card ${activeChain.guess.correct ? 'ok' : 'ng'}`} style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 11, color: '#64748b', fontWeight: 700, marginBottom: 2 }}>5人目：{activeChain.guess.name}の回答</div>
            <div style={{ fontWeight: 800, color: activeChain.guess.correct ? '#047857' : '#be123c' }}>
              {activeChain.guess.text}　{activeChain.guess.correct ? '正解' : '不正解'}
            </div>
          </div>
          {activeChain.guess.correct && (
            <div className="board-card">
              <div style={{ color: '#b45309', fontWeight: 800, marginBottom: 4 }}>参加した全員に +{formatPt(POINTS_BY_DIFFICULTY[activeChain.difficulty])}pt</div>
              <div style={{ fontSize: 11, color: '#94a3b8' }}>{(activeChain.participants || []).map((h) => {
                const step = (activeChain.steps || []).find((s) => s.handle === h);
                return step ? step.name : (activeChain.guess.handle === h ? activeChain.guess.name : h);
              }).join('、')}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
